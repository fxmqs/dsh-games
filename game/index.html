  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('error', function (ev) { reportError((ev && (ev.message || ev.error)) || 'error'); });

    hearts: 3,
    level: 1,
    mode: 'campaign',
    tutorialEnabled: true,
    hintCharges: 2,
    removeCharges: 1,
    gachaCost: 120
  };
  function resolveRules(raw) {
    var out = {};
    for (var k in DEFAULTS) out[k] = DEFAULTS[k];
    if (raw && typeof raw === 'object') {
      for (var rk in raw) {
        if (rk in DEFAULTS) {
          if (typeof DEFAULTS[rk] === 'number') {
            var n = Number(raw[rk]);
            if (isFinite(n)) out[rk] = n;
          } else if (typeof DEFAULTS[rk] === 'boolean') {
            out[rk] = !!raw[rk];
          } else if (typeof DEFAULTS[rk] === 'string' && raw[rk]) {
            out[rk] = String(raw[rk]);
          }
        }
      }
    }
    out.duration = Math.max(2, out.duration);
    out.hearts = Math.max(1, Math.round(out.hearts));
    out.level = Math.max(1, Math.min(60, Math.round(out.level)));
    return out;
  }
  var R = resolveRules(GAME.rules);

    return Math.max(146, Math.min(220, Math.ceil(logicalTop + 10)));
  }

  /* 7. 逆向拓扑可解生成算法（100% 保证无死局） */
  // 方向编码：0=上(-1,0), 1=下(1,0), 2=左(0,-1), 3=右(0,1)
  var DR = [-1, 1, 0, 0];
  var DC = [0, 0, -1, 1];
  var CW = [3, 2, 0, 1]; // 顺时针 90° 映射

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function todaySeedInfo() {
    var now = new Date();
    var y = now.getFullYear();
    var m = now.getMonth() + 1;
    var d = now.getDate();
    var tag = y + '-' + (m < 10 ? '0' + m : m) + '-' + (d < 10 ? '0' + d : d);
    var num = y * 10000 + m * 100 + d;
    return { tag: tag, seed: num };
  }

  function findBlockerInMap(map, gridSize, r, c, dir) {
    var nr = r + DR[dir];
    var nc = c + DC[dir];
    while (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize) {
      var key = nr + ',' + nc;
      if (map[key]) return map[key];
      nr += DR[dir];
      nc += DC[dir];
    }
    return null;
  }

  function solveBoardOrder(gridSize, arrowList) {
    var sim = [];
    var map = {};
    for (var i = 0; i < arrowList.length; i++) {
      var a = arrowList[i];
      var copy = {
        id: a.id,
        r: a.r,
        c: a.c,
        dir: a.dir,
        ice: a.ice || 0,
        kind: a.kind || 'normal',
        rotLeft: a.rotLeft || 0,
        alive: true
      };
      sim.push(copy);
      map[copy.r + ',' + copy.c] = copy;
    }
    var order = [];
    var guard = sim.length * 4 + 10;
    while (order.length < sim.length && guard-- > 0) {
      var picked = null;
      for (var j = 0; j < sim.length; j++) {
        var cur = sim[j];
        if (!cur.alive || cur.ice > 0) continue;
        if (!findBlockerInMap(map, gridSize, cur.r, cur.c, cur.dir)) {
          picked = cur;
          break;
        }
        // 转向机关箭可在允许次数内转向寻路
        if (cur.kind === 'rotator' && cur.rotLeft > 0) {
          var testDir = cur.dir;
          for (var t = 1; t <= cur.rotLeft; t++) {
            testDir = CW[testDir];
            if (!findBlockerInMap(map, gridSize, cur.r, cur.c, testDir)) {
              cur.dir = testDir;
              cur.rotLeft -= t;
              picked = cur;
              break;
            }
          }
          if (picked) break;
        }
      }
      if (!picked) return null;
      picked.alive = false;
      delete map[picked.r + ',' + picked.c];
      order.push(picked.id);
      // 触发 4 邻破冰（雷箭触发 8 邻破冰）
      for (var dr = -1; dr <= 1; dr++) {
        for (var dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          if (picked.kind !== 'bomb' && (Math.abs(dr) + Math.abs(dc) !== 1)) continue;
          var nb = map[(picked.r + dr) + ',' + (picked.c + dc)];
          if (nb && nb.ice > 0) nb.ice = Math.max(0, nb.ice - 1);
        }
      }
    }
    return order.length === sim.length ? order : null;
  }

  function buildLevelArrows(level, mode) {

      for (var p = 0; p < preset.length; p++) {
        arrows.push({
          id: nextId++,
          r: preset[p].r,
          c: preset[p].c,
          dir: preset[p].dir,

    }

    var seed = mode === 'daily' ? todaySeedInfo().seed : (level * 7919 + 202611);
    var rand = mulberry32(seed);
    var cells = [];
    for (var r = 0; r < spec.gridSize; r++) {
      for (var c = 0; c < spec.gridSize; c++) cells.push({ r: r, c: c });
    }
    // Fisher-Yates 洗牌格子
    for (var s = cells.length - 1; s > 0; s--) {
      var sw = Math.floor(rand() * (s + 1));
      var tmp = cells[s]; cells[s] = cells[sw]; cells[sw] = tmp;
    }

    var placedMap = {};
    for (var ci = 0; ci < cells.length && arrows.length < spec.count; ci++) {
      var cell = cells[ci];
      var dirs = [0, 1, 2, 3];
      for (var d = 3; d > 0; d--) {
        var dw = Math.floor(rand() * (d + 1));
        var dt = dirs[d]; dirs[d] = dirs[dw]; dirs[dw] = dt;
      }
      // 优先挑选能制造适度层叠阻挡但仍可解的方向，增强解谜趣味
      var chosen = null;
      for (var di = 0; di < 4; di++) {
        var dir = dirs[di];
        var cand = {
          id: nextId,
          r: cell.r,
          c: cell.c,
          dir: dir,
          kind: 'normal',
          ice: 0,
          rotLeft: 0,
          alive: true,
          shake: 0,
          pop: 1,
          hintGlow: 0
        };
        arrows.push(cand);
        if (solveBoardOrder(spec.gridSize, arrows)) {
          chosen = cand;
          break;
        }
        arrows.pop();
      }
      if (chosen) {
        nextId++;
        placedMap[chosen.r + ',' + chosen.c] = chosen;
      }
    }

    // 按关卡配置安全附加特殊机关（每附一个都校验可解性）
    function assignSpecial(count, mutator) {
      var added = 0;
      for (var k = arrows.length - 1; k >= 0 && added < count; k--) {
        var target = arrows[k];

        var prevKind = target.kind;
        var prevIce = target.ice;
        var prevRot = target.rotLeft;
        mutator(target);
        if (solveBoardOrder(spec.gridSize, arrows)) {
          added++;
        } else {
          target.kind = prevKind;
          target.ice = prevIce;
          target.rotLeft = prevRot;
        }
      }
    }

    assignSpecial(spec.bombCount, function (a) { a.kind = 'bomb'; });
    assignSpecial(spec.goldCount, function (a) { a.kind = 'gold'; });
    assignSpecial(spec.rotCount, function (a) { a.kind = 'rotator'; a.rotLeft = 2; });
    assignSpecial(spec.iceCount, function (a) { a.ice = 1 + (level >= 15 ? 1 : 0); });

    return { spec: spec, arrows: arrows };
  }

    var pts = (arrow.kind === 'gold' ? 30 : 10) + Math.min(50, (combo - 1) * 5);
    score += pts;
    var bonusJade = (arrow.kind === 'gold' ? 6 : 0) + (combo >= 3 ? 2 : 0);
    if (bonusJade > 0) save.jade += bonusJade;

    flying.push({
      x: pos.x,
      y: pos.y,
      cell: pos.cell,
      dir: arrow.dir,
      kind: arrow.kind,
      vx: DC[arrow.dir] * 1450,
      vy: DR[arrow.dir] * 1450,
      trail: [{ x: pos.x, y: pos.y }]
    });
    spawnParticles(pos.x, pos.y, col, arrow.kind === 'bomb' ? 20 : 12);
    sfxFly(combo);
    vibrate(combo >= 3 ? 'medium' : 'light');

    if (combo >= 3) {
      addFloater(pos.x, pos.y - 26, '连清 ×' + combo, '#D97706');
    } else if (arrow.kind === 'gold') {
      addFloater(pos.x, pos.y - 24, '鎏金 +6 灵玉', '#C88A14');
    } else if (forced) {
      addFloater(pos.x, pos.y - 24, '破阵抽离！', '#2BAE85');
    }

    // 破冰联动：普通箭解 4 邻，雷箭震碎 8 邻
    var map = currentArrowMap();
    var cracked = false;
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        if (arrow.kind !== 'bomb' && (Math.abs(dr) + Math.abs(dc) !== 1)) continue;
        var nb = map[(arrow.r + dr) + ',' + (arrow.c + dc)];
        if (nb && nb.ice > 0) {
          nb.ice = Math.max(0, nb.ice - 1);
          cracked = true;
          var npos = cellCenter(nb.r, nb.c);
          spawnParticles(npos.x, npos.y, '#9AD8F5', 10);
          if (nb.ice === 0) addFloater(npos.x, npos.y - 16, '破冰解锁', '#2575B8');
        }
      }
    }
    if (cracked) sfxIce();

    // 推进两步聚光灯教学
    if (tutorialStep === 1 && arrow.role === 'tut1') {
      tutorialStep = 2;
    } else if (tutorialStep === 2 && arrow.role === 'tut2b') {
      tutorialStep = 0;
      save.tutorialDone = true;
      writeSave();
      showToast('已掌握精髓，一口气清空玉盘！');
    }

    // 胜利判定
    if (aliveCount() === 0) {
      phase = 'won';
      tutorialStep = 0;
      toastTimer = 0;
      floaters = [];
      save.tutorialDone = true;
      lastRewardEarned = boardSpec.reward;
      save.jade += lastRewardEarned;
      save.clearedTotal += 1;
      if (maxComboThisRun > save.bestCombo) save.bestCombo = maxComboThisRun;
      if (mode === 'campaign' && level >= save.maxLevel && level < 60) {
        save.maxLevel = level + 1;
      }
      if (mode === 'daily') {
        var td = todaySeedInfo().tag;
        if (save.dailyDates.indexOf(td) === -1) save.dailyDates.push(td);
      }
      writeSave();
      sfxWin();
      vibrate('medium');
      spawnParticles(W * 0.5, H * 0.42, '#FFD452', 36);
      spawnParticles(W * 0.5, H * 0.42, '#2BAE85', 24);
    }
  }

  function handleArrowTap(arrow) {
    if (!arrow || !arrow.alive || phase !== 'playing') return;

    // 聚光灯教学期锁死无关箭块
    if (tutorialStep === 1 && arrow.role !== 'tut1') {
      showToast('先点金色光圈里的箭试试');
      return;
    }
    if (tutorialStep === 2 && arrow.role !== 'tut2b') {
      showToast('先清掉前方挡路的箭块');
      return;
    }

    // 破阵抽离模式：无视冰封与阻挡强制移除
    if (removeMode) {
      removeMode = false;
      removeCharges = Math.max(0, removeCharges - 1);
      arrow.ice = 0;
      launchArrow(arrow, true);
      return;
    }

    // 冰封拦截
    if (arrow.ice > 0) {
      arrow.shake = 0.28;
      sfxBlocked();
      vibrate('light');
      showToast('先清周围相邻箭即可破冰');
      return;
    }

    var map = currentArrowMap();
    var blocker = findBlockerInMap(map, boardSpec.gridSize, arrow.r, arrow.c, arrow.dir);
    if (!blocker) {
      launchArrow(arrow, false);
      return;
    }

    // 转向机关箭：受阻时不扣心，原地顺时针旋转 90°
    if (arrow.kind === 'rotator' && arrow.rotLeft > 0) {
      arrow.dir = CW[arrow.dir];
      arrow.rotLeft -= 1;
      arrow.pop = 1.24;
      sfxClick();
      vibrate('light');
      var rpos = cellCenter(arrow.r, arrow.c);
      addFloater(rpos.x, rpos.y - 20, '转向成功', '#2BAE85');
      return;
    }

    // 普通受阻：弹回 + 扣心
    arrow.shake = 0.34;
    blocker.shake = 0.16;
    combo = 0;
    comboTimer = 0;
    mistakes++;
    sfxBlocked();
    vibrate('medium');
    screenShake = 0.18;
    if (tutorialStep === 0) {
      hearts = Math.max(0, hearts - 1);
      var bpos = cellCenter(arrow.r, arrow.c);
      addFloater(bpos.x, bpos.y - 20, '前方受阻 -1 心', '#D9483B');
      if (hearts <= 0) {
        phase = 'lost';
        toastTimer = 0;
        floaters = [];
      }
    }
  }

  function useHintTool() {
    if (phase !== 'playing') return;
    if (hintCharges <= 0) {
      triggerRewardAd('powerup', function () {
        hintCharges += 2;
        showToast('已补充天眼指路 ×2');
        useHintTool();
      });
      return;
    }
    var remaining = arrows.filter(function (a) { return a.alive; });
    var order = solveBoardOrder(boardSpec.gridSize, remaining);
    if (!order || !order.length) {
      showToast('试试破阵抽离打开局面');
      return;
    }
    hintCharges--;
    sfxClick();
    var topIds = order.slice(0, 3);
    for (var i = 0; i < arrows.length; i++) {
      if (topIds.indexOf(arrows[i].id) !== -1) arrows[i].hintGlow = 3.6;
    }
    showToast('金色光环为推荐出箭顺序');
  }

  function useRemoveTool() {
    if (phase !== 'playing') return;
    if (removeMode) {
      removeMode = false;
      showToast('已取消破阵抽离');
      return;
    }
    if (removeCharges <= 0) {
      triggerRewardAd('powerup', function () {
        removeCharges += 1;
        removeMode = true;
        showToast('请点击任意一支箭直接抽离');
      });
      return;
    }
    removeMode = true;
    sfxClick();
    showToast('抽离已就绪：点任意箭直接清出');
  }

  function performGacha() {
    if (save.jade < R.gachaCost) {
      showToast('灵玉不足，通关即可免费获取');
      sfxBlocked();
      return;
    }
    save.jade -= R.gachaCost;
    var roll = Math.random() * 100;
    var pick = roll < 60 ? SKINS[1] : (roll < 90 ? SKINS[2] : SKINS[3]);
    if (save.unlockedSkins.indexOf(pick.id) === -1) {
      save.unlockedSkins.push(pick.id);
      save.skinId = pick.id;
      gachaBanner = '喜获「' + pick.name + '」（' + pick.rarity + '），已自动换装！';
    } else {
      save.jade += 60;
      gachaBanner = '抽中已有「' + pick.name + '」，自动返还 60 灵玉';
    }
    writeSave();
    sfxWin();
    vibrate('medium');
  }

  /* 9. 按钮系统（带果冻缩放动画） */
  function registerBtn(id, x, y, w, h, action) {
    activeButtons.push({ id: id, x: x, y: y, w: w, h: h, action: action });
  }
  function pressBtnAnim(id) { btnAnim[id] = 1.0; }
  function getBtnScale(id) {
    var t = btnAnim[id] || 0;
    if (t <= 0) return 1;
    if (t > 0.5) return 1 - (1 - (t - 0.5) * 2) * 0.08;
    return 1 + Math.sin((t / 0.5) * Math.PI) * 0.04;
  }

  /* 10. 绘图工具（纯 Canvas 2D，圆角/果冻立体质感） */
  function rr(x, y, w, h, r) {
    var rad = Math.min(r, w * 0.5, h * 0.5);
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.lineTo(x + w - rad, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
    ctx.lineTo(x + w, y + h - rad);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
    ctx.lineTo(x + rad, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
    ctx.lineTo(x, y + rad);
    ctx.quadraticCurveTo(x, y, x + rad, y);
    ctx.closePath();
  }

  function drawJellyButton(id, x, y, w, h, label, sub, fill, darkFill, textColor, action) {
    registerBtn(id, x, y, w, h, action);
    var sc = getBtnScale(id);
    ctx.save();
    ctx.translate(x + w * 0.5, y + h * 0.5);
    ctx.scale(sc, sc);
    ctx.translate(-w * 0.5, -h * 0.5);

    // 底部立体厚边
    rr(0, 6, w, h, 22);
    ctx.fillStyle = darkFill;
    ctx.fill();

    // 主体
    rr(0, 0, w, h, 22);
    ctx.fillStyle = fill;
    ctx.fill();

    // 顶部柔和果冻高光
    rr(10, 5, w - 20, h * 0.34, 14);
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.fill();

    ctx.fillStyle = textColor || '#FFFFFF';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (sub) {
      ctx.font = 'bold 26px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(label, w * 0.5, h * 0.40);
      ctx.font = '600 18px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.globalAlpha = 0.9;
      ctx.fillText(sub, w * 0.5, h * 0.72);
    } else {
      ctx.font = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(label, w * 0.5, h * 0.52);
    }
    ctx.restore();
  }

  function drawArrowTile(g, cx, cy, size, dir, kind, ice, rotLeft, skin, glowAlpha) {
    var pad = size * 0.08;
    var s = size - pad * 2;
    var half = s * 0.5;
    var fill = skin.dirs[dir];
    var dark = skin.dirsDark[dir];
    if (kind === 'gold') { fill = '#F2B93B'; dark = '#B57B0D'; }
    if (kind === 'bomb') { fill = '#E05252'; dark = '#9C2727'; }

    g.save();
    g.translate(cx, cy);

    if (glowAlpha > 0) {
      g.save();
      g.globalAlpha = glowAlpha;
      g.beginPath();
      g.arc(0, 0, half * 1.18, 0, Math.PI * 2);
      g.strokeStyle = '#FFD452';
      g.lineWidth = 7;
      g.stroke();
      g.restore();
    }

    // 立体底边阴影
    rrPath(g, -half, -half + 5, s, s, s * 0.24);
    g.fillStyle = dark;
    g.fill();

    // 箭块主体
    rrPath(g, -half, -half, s, s, s * 0.24);
    g.fillStyle = fill;
    g.fill();

    // 顶部琉璃高光
    rrPath(g, -half + s * 0.1, -half + s * 0.07, s * 0.8, s * 0.30, s * 0.14);
    g.fillStyle = 'rgba(255,255,255,0.28)';
    g.fill();

    // 旋转方向绘制高辨识白色箭头
    g.save();
    var angles = [-Math.PI * 0.5, Math.PI * 0.5, Math.PI, 0];
    g.rotate(angles[dir]);
    g.fillStyle = '#FFFFFF';
    g.beginPath();
    var aw = s * 0.27;
    var ah = s * 0.25;
    g.moveTo(aw, 0);
    g.lineTo(-aw * 0.15, -ah);
    g.lineTo(-aw * 0.15, -ah * 0.42);
    g.lineTo(-aw, -ah * 0.42);
    g.lineTo(-aw, ah * 0.42);
    g.lineTo(-aw * 0.15, ah * 0.42);
    g.lineTo(-aw * 0.15, ah);
    g.closePath();
    g.fill();
    g.restore();

    // 特殊机关徽标
    if (kind === 'gold') {
      g.fillStyle = '#FFF9DB';
      g.font = 'bold ' + Math.round(s * 0.24) + 'px sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText('★', half - s * 0.20, -half + s * 0.22);
    } else if (kind === 'bomb') {
      g.fillStyle = '#FFE066';
      g.font = 'bold ' + Math.round(s * 0.24) + 'px sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText('雷', half - s * 0.22, -half + s * 0.24);
    } else if (kind === 'rotator' && rotLeft > 0) {
      g.strokeStyle = '#FFFFFF';
      g.lineWidth = 3;
      g.beginPath();
      g.arc(half - s * 0.22, -half + s * 0.22, s * 0.13, 0, Math.PI * 1.6);
      g.stroke();
    }

    // 冰封覆盖层
    if (ice > 0) {
      rrPath(g, -half, -half, s, s, s * 0.24);
      g.fillStyle = 'rgba(154,216,245,0.58)';
      g.fill();
      g.strokeStyle = '#FFFFFF';
      g.lineWidth = 3;
      g.stroke();

      g.fillStyle = '#145374';
      g.beginPath();
      g.arc(half - s * 0.22, -half + s * 0.22, s * 0.19, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = '#FFFFFF';
      g.font = 'bold ' + Math.round(s * 0.24) + 'px sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(String(ice), half - s * 0.22, -half + s * 0.23);
    }

    g.restore();
  }

  function rrPath(g, x, y, w, h, r) {
    var rad = Math.min(r, w * 0.5, h * 0.5);
    g.beginPath();
    g.moveTo(x + rad, y);
    g.lineTo(x + w - rad, y);
    g.quadraticCurveTo(x + w, y, x + w, y + rad);
    g.lineTo(x + w, y + h - rad);
    g.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
    g.lineTo(x + rad, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - rad);
    g.lineTo(x, y + rad);
    g.quadraticCurveTo(x, y, x + rad, y);
    g.closePath();
  }

  /* 11. 侧栏与试玩角色特写导出（window.__renderSlots） */
  function drawSlotPreview(slot, size) {
    var cv = document.createElement('canvas');
    cv.width = size;
    cv.height = size;
    var g = cv.getContext('2d');
    var skin = currentSkin();
    if (slot === 'hero') {
      drawArrowTile(g, size * 0.5, size * 0.5, size * 0.82, 0, 'normal', 0, 0, skin, 0);
    } else if (slot === 'enemy') {
      drawArrowTile(g, size * 0.5, size * 0.5, size * 0.82, 3, 'bomb', 2, 0, skin, 0);
    } else {
      // 灵玉图标
      g.save();
      g.translate(size * 0.5, size * 0.5);
      g.beginPath();
      g.moveTo(0, -size * 0.36);
      g.lineTo(size * 0.28, 0);
      g.lineTo(0, size * 0.36);
      g.lineTo(-size * 0.28, 0);
      g.closePath();
      g.fillStyle = '#2BAE85';
      g.fill();
      g.lineWidth = size * 0.04;
      g.strokeStyle = '#FFD452';
      g.stroke();
      g.beginPath();
      g.moveTo(0, -size * 0.22);
      g.lineTo(size * 0.14, 0);
      g.lineTo(0, size * 0.10);
      g.lineTo(-size * 0.14, 0);
      g.closePath();
      g.fillStyle = 'rgba(255,255,255,0.45)';
      g.fill();
      g.restore();
    }
    try { return cv.toDataURL('image/png'); } catch (_e) { return ''; }
  }

  window.__renderSlots = function (size) {
    var s = size || 256;
    return {
      hero: drawSlotPreview('hero', s),
      enemy: drawSlotPreview('enemy', s),
      pickup: drawSlotPreview('pickup', s)
    };
  };

    ctx.arc(110, 260, 140, 0, Math.PI * 2);

    ctx.fill();
    ctx.restore();
  }

  function drawBoardAndArrows(skin) {
    var rect = getBoardRect();
    var pad = 20;
    var inner = rect.size - pad * 2;
    var cell = inner / boardSpec.gridSize;

    // 玉盘底板
    rr(rect.x, rect.y + 8, rect.size, rect.size, 32);
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fill();

    rr(rect.x, rect.y, rect.size, rect.size, 32);
    ctx.fillStyle = skin.boardFill;
    ctx.fill();
    ctx.strokeStyle = removeMode ? '#E05252' : skin.boardBorder;
    ctx.lineWidth = removeMode ? 5 : 4;
    ctx.stroke();

    // 淡雅棋格底槽
    for (var r = 0; r < boardSpec.gridSize; r++) {
      for (var c = 0; c < boardSpec.gridSize; c++) {
        var gx = rect.x + pad + c * cell + 5;
        var gy = rect.y + pad + r * cell + 5;
        rr(gx, gy, cell - 10, cell - 10, Math.min(18, cell * 0.22));
        ctx.fillStyle = skin.cellFill;
        ctx.fill();
      }
    }

    // 静止箭块
    for (var i = 0; i < arrows.length; i++) {
      var a = arrows[i];
      if (!a.alive) continue;
      var pos = cellCenter(a.r, a.c);
      var sx = a.shake > 0 ? Math.sin(a.shake * 70) * 8 : 0;
      var glow = a.hintGlow > 0 ? (0.55 + Math.sin(elapsed * 10) * 0.35) : 0;
      ctx.save();
      ctx.translate(pos.x + sx, pos.y);
      ctx.scale(a.pop, a.pop);
      drawArrowTile(ctx, 0, 0, pos.cell, a.dir, a.kind, a.ice, a.rotLeft, skin, glow);
      ctx.restore();
    }

    // 飞出流光箭块
    for (var f = 0; f < flying.length; f++) {
      var fl = flying[f];
      if (fl.trail.length > 1) {
        ctx.save();
        ctx.strokeStyle = skin.dirs[fl.dir];
        ctx.lineWidth = fl.cell * 0.22;
        ctx.lineCap = 'round';
        ctx.globalAlpha = 0.28;
        ctx.beginPath();
        ctx.moveTo(fl.trail[0].x, fl.trail[0].y);
        for (var ti = 1; ti < fl.trail.length; ti++) ctx.lineTo(fl.trail[ti].x, fl.trail[ti].y);
        ctx.stroke();
        ctx.restore();
      }
      drawArrowTile(ctx, fl.x, fl.y, fl.cell * 0.92, fl.dir, fl.kind, 0, 0, skin, 0);
    }

    // 底部状态提示条
    var statusY = 1018;
    rr(56, statusY - 30, W - 112, 60, 30);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 26px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = removeMode ? '#D9483B' : skin.titleColor;
    var statusLabel = removeMode
      ? '抽离模式：轻点任意箭块直接移出'
      : (combo >= 2
        ? ('连清 ×' + combo + ' · 剩余 ' + aliveCount() + ' 支灵箭')
        : ('剩余 ' + aliveCount() + ' 支灵箭 · 顺方向清空全盘'));
    ctx.fillText(statusLabel, W * 0.5, statusY);

    // 底部 3 枚大果冻道具按钮（零强制插屏，用尽后主动触发激励视频/首发限免）
    var toolY = 1094;
    var hintSub = hintCharges > 0 ? ('剩余 ' + hintCharges + ' 次') : '首发限免补充';
    var remSub = removeMode ? '点击取消' : (removeCharges > 0 ? ('剩余 ' + removeCharges + ' 次') : '首发限免补充');
    drawJellyButton('tool_hint', 40, toolY, 204, 108, '天眼指路', hintSub, '#3B8CE6', '#2463AC', '#FFFFFF', useHintTool);
    drawJellyButton('tool_remove', 258, toolY, 204, 108, '破阵抽离', remSub, removeMode ? '#D9483B' : '#E9A626', removeMode ? '#9C2727' : '#B37A10', '#FFFFFF', useRemoveTool);

  function drawSpotlightTutorial() {
    if (phase !== 'playing' || modal || tutorialStep <= 0) return;
    var targetRole = tutorialStep === 1 ? 'tut1' : 'tut2b';
    var target = null;
    var blocked = null;
    for (var i = 0; i < arrows.length; i++) {
      if (arrows[i].role === targetRole && arrows[i].alive) target = arrows[i];
      if (arrows[i].role === 'tut2a' && arrows[i].alive) blocked = arrows[i];
    }
    if (!target) { tutorialStep = 0; return; }
    var pos = cellCenter(target.r, target.c);
    var pulse = 1 + Math.sin(elapsed * 6) * 0.08;

    ctx.save();
    // 柔暗遮罩，留出目标高亮（覆盖超长屏边缘）
    ctx.fillStyle = 'rgba(18, 32, 26, 0.42)';
    ctx.fillRect(-200, -400, W + 400, H + 800);

    // 第 2 步顺带虚线标出挡路关系
    if (tutorialStep === 2 && blocked) {
      var bpos = cellCenter(blocked.r, blocked.c);
      drawArrowTile(ctx, bpos.x, bpos.y, bpos.cell, blocked.dir, blocked.kind, 0, 0, currentSkin(), 0);
      ctx.save();
      ctx.setLineDash([8, 6]);
      ctx.strokeStyle = '#FF6B6B';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(bpos.x + bpos.cell * 0.2, bpos.y);
      ctx.lineTo(pos.x - pos.cell * 0.2, pos.y);
      ctx.stroke();
      ctx.restore();
    }

    // 重绘聚光目标箭块并加金色脉冲框
    drawArrowTile(ctx, pos.x, pos.y, pos.cell, target.dir, target.kind, 0, 0, currentSkin(), 0);
    ctx.strokeStyle = '#FFD452';
    ctx.lineWidth = 8;
    rr(pos.x - pos.cell * 0.52 * pulse, pos.y - pos.cell * 0.52 * pulse, pos.cell * 1.04 * pulse, pos.cell * 1.04 * pulse, 24);
    ctx.stroke();

    // 简明短标牌（不超过 8 字）
    var tip = tutorialStep === 1 ? '第一步：点它飞出阵' : '第二步：先清挡路箭';
    var tipY = pos.y - pos.cell * 0.92;
    if (tipY < 260) tipY = pos.y + pos.cell * 0.95;
    rr(W * 0.5 - 190, tipY - 34, 380, 68, 34);
    ctx.fillStyle = '#FFD452';
    ctx.fill();
    ctx.fillStyle = '#234236';
    ctx.font = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tip, W * 0.5, tipY + 1);
    ctx.restore();
  }

  /* 13. 输入事件（单手触控 + 鼠标 + 键盘 Enter 启动） */
  function toLogical(clientX, clientY) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var lx = (clientX - rect.left - offsetX) / (scale || 1);
    var ly = (clientY - rect.top - offsetY) / (scale || 1);
    return { x: lx, y: ly };
  }

  function handleTap(lx, ly) {
    unlockAudio();
    // 优先命中当前顶层可见按钮
    for (var i = activeButtons.length - 1; i >= 0; i--) {
      var b = activeButtons[i];
      if (lx >= b.x && lx <= b.x + b.w && ly >= b.y && ly <= b.y + b.h) {
        pressBtnAnim(b.id);
        b.action();
        return;
      }
    }
    if (modal) return;
    if (phase === 'title') {
      var nextLv = R.level > 1 ? R.level : (save.tutorialDone ? Math.min(60, save.maxLevel || 1) : 1);
      startLevel(nextLv, R.mode);
      return;
    }
    if (phase !== 'playing' || !boardSpec) return;

    var rect = getBoardRect();
    var pad = 20;
    var inner = rect.size - pad * 2;
    var cell = inner / boardSpec.gridSize;
    var c = Math.floor((lx - (rect.x + pad)) / cell);
    var r = Math.floor((ly - (rect.y + pad)) / cell);
    if (r < 0 || r >= boardSpec.gridSize || c < 0 || c >= boardSpec.gridSize) return;
    for (var a = 0; a < arrows.length; a++) {
      if (arrows[a].alive && arrows[a].r === r && arrows[a].c === c) {
        handleArrowTap(arrows[a]);
        return;
      }
    }
  }

  canvas.addEventListener('pointerdown', function (ev) {
    if (ev && typeof ev.preventDefault === 'function') ev.preventDefault();
    var pt = toLogical(ev.clientX, ev.clientY);
    handleTap(pt.x, pt.y);
  });

  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('keydown', function (ev) {
      if (!ev) return;
      if (ev.key === 'Enter' || ev.key === ' ') {
        if (phase === 'title') {
          unlockAudio();
          var nextLv = save.tutorialDone ? Math.min(60, save.maxLevel || 1) : 1;
          startLevel(nextLv, 'campaign');
        } else if (phase === 'won' || phase === 'lost') {
          startLevel(phase === 'won' ? Math.min(60, level + 1) : level, mode);
        }
      }
    });
  }

  /* 14. 主循环与动画更新 */
  function update(dt) {
    elapsed += dt;
    if (toastTimer > 0) toastTimer = Math.max(0, toastTimer - dt);
    if (screenShake > 0) screenShake = Math.max(0, screenShake - dt);
    for (var bk in btnAnim) {
      if (btnAnim[bk] > 0) btnAnim[bk] = Math.max(0, btnAnim[bk] - dt * 5.2);
    }

    if (phase === 'playing' && !modal) {
      if (tutorialStep === 0) {
        timeLeft = Math.max(0, timeLeft - dt);
        if (timeLeft <= 0) phase = 'lost';
      }
      if (comboTimer > 0) {
        comboTimer = Math.max(0, comboTimer - dt);
        if (comboTimer === 0) combo = 0;
      }
    }

    for (var i = 0; i < arrows.length; i++) {
      var a = arrows[i];
      if (a.shake > 0) a.shake = Math.max(0, a.shake - dt);
      if (a.hintGlow > 0) a.hintGlow = Math.max(0, a.hintGlow - dt);
      if (a.pop > 1) a.pop = Math.max(1, a.pop - dt * 2.4);
    }

    for (var f = flying.length - 1; f >= 0; f--) {
      var fl = flying[f];
      fl.x += fl.vx * dt;
      fl.y += fl.vy * dt;
      fl.trail.push({ x: fl.x, y: fl.y });
      if (fl.trail.length > 7) fl.trail.shift();
      if (fl.x < -120 || fl.x > W + 120 || fl.y < -120 || fl.y > H + 120) {
        flying.splice(f, 1);
      }
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vy += 260 * dt;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(p, 1);
    }

    for (var fli = floaters.length - 1; fli >= 0; fli--) {
      var fo = floaters[fli];
      fo.y -= 55 * dt;
      fo.life -= dt;
      if (fo.life <= 0) floaters.splice(fli, 1);
    }
  }

  function render() {
    var skin = currentSkin();
    activeButtons = [];

    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var fullGrad = ctx.createLinearGradient(0, 0, 0, viewH);
    fullGrad.addColorStop(0, skin.bgTop);
    fullGrad.addColorStop(1, skin.bgBot);
    ctx.fillStyle = fullGrad;
    ctx.fillRect(0, 0, viewW, viewH);

    var shx = screenShake > 0 ? Math.sin(elapsed * 90) * 6 : 0;
    ctx.translate(offsetX + shx, offsetY);
    ctx.scale(scale, scale);

    drawBackground(skin);
    if (phase === 'title') {
      drawTitleScreen(skin);
    } else {
      drawHud(skin);
      drawBoardAndArrows(skin);
      drawSpotlightTutorial();
      drawResultOverlay(skin);
    }
    drawModalOverlay(skin);
    drawEffects();
    ctx.restore();
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
    lastTs = ts;
    fpsFrames++;
    fpsAccum += dt;
    if (fpsAccum >= 0.5) {
      fps = Math.round(fpsFrames / fpsAccum);
      fpsFrames = 0;
      fpsAccum = 0;
    }
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* 15. 微信分享动态文案与 Game Studio 自动试玩契约 */
  window.__wxSharePayload = function () {
    if (mode === 'daily') {
      return { title: '今日千人同盘箭阵已破！仅耗 ' + mistakes + ' 次失误，敢来挑战同一盘吗？' };
    }
    if (phase === 'won') {
      return { title: '我在《' + TITLE + '》连清 ' + maxComboThisRun + ' 箭破阵！这解压手感太上头了' };
    }
    return { title: '看清方向一键飞箭，连招清空玉盘极度解压！' };
  };

  window.__gameState = function () {
    return {
      phase: phase,
      score: score,
      hearts: hearts,
      fps: fps,
      level: level,
      mode: mode,
      remainingArrows: aliveCount(),
      combo: combo,
      maxCombo: maxComboThisRun,
      jade: save.jade,
      tutorialStep: tutorialStep,
      hero: { x: W * 0.5, y: H * 0.5 },
      pickups: [],
      enemies: [],
      world: { w: W, h: H }
    };
  };

  var autoCooldown = 0;
  window.__autoplay = function () {
    if (modal) { modal = null; return; }
    if (phase === 'title') {
      startLevel(R.level, R.mode);
      return;
    }
    if (phase !== 'playing') return;
    autoCooldown++;
    if (autoCooldown % 4 !== 0) return;

    if (tutorialStep === 1) {
      for (var t1 = 0; t1 < arrows.length; t1++) {
        if (arrows[t1].alive && arrows[t1].role === 'tut1') { handleArrowTap(arrows[t1]); return; }
      }
    }
    if (tutorialStep === 2) {
      for (var t2 = 0; t2 < arrows.length; t2++) {
        if (arrows[t2].alive && arrows[t2].role === 'tut2b') { handleArrowTap(arrows[t2]); return; }
      }
    }

    var map = currentArrowMap();
    for (var i = 0; i < arrows.length; i++) {
      var a = arrows[i];
      if (!a.alive || a.ice > 0) continue;
      if (!findBlockerInMap(map, boardSpec.gridSize, a.r, a.c, a.dir)) {
        handleArrowTap(a);
        return;
      }
    }
    // 若仅剩转向箭需先旋转
    for (var r = 0; r < arrows.length; r++) {
      var ra = arrows[r];
      if (ra.alive && ra.kind === 'rotator' && ra.rotLeft > 0) {
        handleArrowTap(ra);
        return;
      }
    }
  };

  // 向侧栏上报自定义角色缩略图
  setTimeout(function () {
    try { post({ type: 'renders', renders: window.__renderSlots(256) }); } catch (_e) {}
  }, 120);
})();
</script>
