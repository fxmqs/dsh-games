  function todaySeedInfo() {
    var now = new Date();
    var y = now.getFullYear();
    var m = now.getMonth() + 1;
    var d = now.getDate();
    var tag = y + '-' + (m < 10 ? '0' + m : m) + '-' + (d < 10 ? '0' + d : d);
    var num = y * 10000 + m * 100 + d;
    return { tag: tag, seed: num };
  }

  function prevDateTag(dateTag) {
    var parts = String(dateTag || '').split('-');
    if (parts.length !== 3) return '';
    var dt = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    dt.setDate(dt.getDate() - 1);
    var y = dt.getFullYear();
    var m = dt.getMonth() + 1;
    var d = dt.getDate();
    return y + '-' + (m < 10 ? '0' + m : m) + '-' + (d < 10 ? '0' + d : d);
  }

  function currentWeekInfo() {
    var now = new Date();
    var target = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
    var dayNum = target.getUTCDay() || 7;
    target.setUTCDate(target.getUTCDate() + 4 - dayNum);
    var yearStart = new Date(Date.UTC(target.getUTCFullYear(), 0, 1));
    var weekNo = Math.ceil((((target - yearStart) / 86400000) + 1) / 7);
    var wStr = weekNo < 10 ? ('0' + weekNo) : String(weekNo);
    var y = target.getUTCFullYear();
    return {
      tag: y + '-W' + wStr,
      label: '第' + weekNo + '周大师赛',
      seed: y * 100 + weekNo
    };
  }

  /* 7. 逆向拓扑可解生成算法（解链深度评分 + 双生锁链 + 隐向迷雾，100% 保证无死局） */
  var DR = [-1, 1, 0, 0];
  var DC = [0, 0, -1, 1];
  var CW = [3, 2, 0, 1];

  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function findBlockerInMap(map, gridSize, r, c, dir) {
    var nr = r + DR[dir];
    var nc = c + DC[dir];
    while (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize) {
      var key = nr + ',' + nc;
      if (map[key]) return map[key];
      nr += DR[dir];
      nc += DC[dir];
    }
    return null;
  }

  function solveBoardOrder(gridSize, arrowList) {
    var sim = [];
    var map = {};
    for (var i = 0; i < arrowList.length; i++) {
      var a = arrowList[i];
      var copy = {
        id: a.id, r: a.r, c: a.c, dir: a.dir,
        ice: a.ice || 0, kind: a.kind || 'normal',
        rotLeft: a.rotLeft || 0, pairId: a.pairId || 0,
        alive: true
      };
      sim.push(copy);
      map[copy.r + ',' + copy.c] = copy;
    }
    var order = [];
    var guard = sim.length * 4 + 10;
    while (order.length < sim.length && guard-- > 0) {
      var picked = null;
      for (var j = 0; j < sim.length; j++) {
        var cur = sim[j];
        if (!cur.alive || cur.ice > 0) continue;
        if (!findBlockerInMap(map, gridSize, cur.r, cur.c, cur.dir)) {
          picked = cur;
          break;
        }
        if (cur.kind === 'rotator' && cur.rotLeft > 0) {
          var testDir = cur.dir;
          for (var t = 1; t <= cur.rotLeft; t++) {
            testDir = CW[testDir];
            if (!findBlockerInMap(map, gridSize, cur.r, cur.c, testDir)) {
              cur.dir = testDir;
              cur.rotLeft -= t;
              picked = cur;
              break;
            }
          }
          if (picked) break;
        }
      }
      if (!picked) return null;
      picked.alive = false;
      delete map[picked.r + ',' + picked.c];
      order.push(picked.id);
      for (var dr = -1; dr <= 1; dr++) {
        for (var dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          if (picked.kind !== 'bomb' && (Math.abs(dr) + Math.abs(dc) !== 1)) continue;
          var nb = map[(picked.r + dr) + ',' + (picked.c + dc)];
          if (nb && nb.ice > 0) nb.ice = Math.max(0, nb.ice - 1);
        }
      }
    }
    return order.length === sim.length ? order : null;
  }

  function buildLevelArrows(lv, m) {
    var spec = levelSpec(lv, m);
    var arrowsOut = [];
    var nextId = 1;

    // 第 1 关：手工精调 4x4 教学阵（6 支箭），精准服务两步聚光灯引导
    if (m === 'campaign' && lv === 1) {
      var preset = [
        { r: 0, c: 1, dir: 0, kind: 'normal', ice: 0, role: 'tut1' },
        { r: 1, c: 2, dir: 3, kind: 'normal', ice: 0, role: 'tut2b' },
        { r: 1, c: 1, dir: 3, kind: 'gold', ice: 0, role: 'tut2a' },
        { r: 2, c: 1, dir: 2, kind: 'normal', ice: 0 },
        { r: 2, c: 2, dir: 1, kind: 'normal', ice: 0 },
        { r: 3, c: 0, dir: 2, kind: 'normal', ice: 0 }
      ];
      for (var p = 0; p < preset.length; p++) {
        arrowsOut.push({
          id: nextId++, r: preset[p].r, c: preset[p].c, dir: preset[p].dir,
          kind: preset[p].kind, ice: preset[p].ice, rotLeft: 0, pairId: 0, mist: false,
          role: preset[p].role || '', alive: true, shake: 0, pop: 1, hintGlow: 0
        });
      }
      return { spec: spec, arrows: arrowsOut };
    }

    var seed = m === 'daily'
      ? (todaySeedInfo().seed * 13 + 7)
      : (m === 'weekly' ? (currentWeekInfo().seed * 97 + lv * 313) : (lv * 7919 + 202611));
    var rand = mulberry32(seed);
    var cells = [];
    for (var r = 0; r < spec.gridSize; r++) {
      for (var c = 0; c < spec.gridSize; c++) cells.push({ r: r, c: c });
    }
    for (var s = cells.length - 1; s > 0; s--) {
      var sw = Math.floor(rand() * (s + 1));
      var tmp = cells[s]; cells[s] = cells[sw]; cells[sw] = tmp;
    }

    var placedMap = {};
    for (var ci = 0; ci < cells.length && arrowsOut.length < spec.count; ci++) {
      var cell = cells[ci];
      var dirs = [0, 1, 2, 3];
      for (var d = 3; d > 0; d--) {
        var dw = Math.floor(rand() * (d + 1));
        var dt = dirs[d]; dirs[d] = dirs[dw]; dirs[dw] = dt;
      }
      // 解链深度评分：在所有可解方向中优先选存在适度互锁/连清依赖的方向，告别平铺直出
      var bestCand = null;
      var bestScore = -999;
      for (var di = 0; di < 4; di++) {
        var dir = dirs[di];
        var cand = {
          id: nextId, r: cell.r, c: cell.c, dir: dir,
          kind: 'normal', ice: 0, rotLeft: 0, pairId: 0, mist: false,
          alive: true, shake: 0, pop: 1, hintGlow: 0
        };
        arrowsOut.push(cand);
        if (solveBoardOrder(spec.gridSize, arrowsOut)) {
          var blockedByExisting = findBlockerInMap(placedMap, spec.gridSize, cell.r, cell.c, dir) ? 2 : 0;
          var innerBonus = (cell.r > 0 && cell.r < spec.gridSize - 1 && cell.c > 0 && cell.c < spec.gridSize - 1) ? 1 : 0;
          var scoreDir = blockedByExisting + innerBonus + rand() * 0.6;
          if (scoreDir > bestScore) {
            bestScore = scoreDir;
            bestCand = cand;
          }
        }
        arrowsOut.pop();
      }
      if (bestCand) {
        arrowsOut.push(bestCand);
        nextId++;
        placedMap[bestCand.r + ',' + bestCand.c] = bestCand;
      }
    }

    function assignSpecial(count, mutator) {
      var added = 0;
      for (var k = arrowsOut.length - 1; k >= 0 && added < count; k--) {
        var target = arrowsOut[k];
        if (target.kind !== 'normal' || target.ice > 0 || target.pairId > 0 || target.mist) continue;
        var prevKind = target.kind;
        var prevIce = target.ice;
        var prevRot = target.rotLeft;
        var prevMist = target.mist;
        mutator(target);
        if (solveBoardOrder(spec.gridSize, arrowsOut)) {
          added++;
        } else {
          target.kind = prevKind;
          target.ice = prevIce;
          target.rotLeft = prevRot;
          target.mist = prevMist;
        }
      }
    }

    assignSpecial(spec.bombCount, function (a) { a.kind = 'bomb'; });
    assignSpecial(spec.goldCount, function (a) { a.kind = 'gold'; });
    assignSpecial(spec.rotCount, function (a) { a.kind = 'rotator'; a.rotLeft = 4; });
    assignSpecial(spec.iceCount, function (a) { a.ice = 1 + (lv >= 18 ? 1 : 0); });

    // 双生锁链箭（每对 2 支，不破坏可解性）
    var pairTarget = spec.pairCount || 0;
    var pairAssigned = 0;
    var pairPool = [];
    for (var pi = 0; pi < arrowsOut.length; pi++) {
      if (arrowsOut[pi].kind === 'normal' && arrowsOut[pi].ice === 0) pairPool.push(arrowsOut[pi]);
    }
    for (var pj = 0; pj + 1 < pairPool.length && pairAssigned < pairTarget; pj += 2) {
      pairAssigned++;
      pairPool[pj].pairId = pairAssigned;
      pairPool[pj + 1].pairId = pairAssigned;
    }

    // 隐向迷雾箭（相邻清出自动揭雾，不破坏可解性）
    var mistTarget = spec.mistCount || 0;
    var mistAdded = 0;
    for (var mi = 0; mi < arrowsOut.length && mistAdded < mistTarget; mi++) {
      var ma = arrowsOut[mi];
      if (ma.kind === 'normal' && ma.ice === 0 && ma.pairId === 0) {
        ma.mist = true;
        mistAdded++;
      }
    }

    return { spec: spec, arrows: arrowsOut };
  }

    else if (m === 'campaign' && lv === 26) { key = 'bomb'; text = '新机关·雷箭：飞出触发冲击波，震碎八邻冰封'; }

    // 5 连清箭气槽：满 5 格触发箭气盈盘！

      screenShake = 0.22;
      sfxBoom();
    }

    flying.push({
      x: pos.x, y: pos.y, cell: pos.cell, dir: arrow.dir, kind: arrow.kind,
      trailStyle: skin.trailStyle || 'jade',
      vx: DC[arrow.dir] * 1480, vy: DR[arrow.dir] * 1480,
      trail: [{ x: pos.x, y: pos.y }]
    });
    spawnParticles(pos.x, pos.y, col, arrow.kind === 'bomb' ? 24 : 12);
    if (forced) {
      sfxRemoveTool();
    } else if (arrow.kind === 'gold') {
      sfxGoldArrow();
    } else if (!qiBurstTriggered && arrow.kind !== 'bomb') {
      sfxFly(combo);
    }

    if (combo >= 3) {
      addFloater(pos.x, pos.y - 26, '连清 ×' + combo, '#B67B1B');
    } else if (arrow.kind === 'gold') {
      addFloater(pos.x, pos.y - 24, '鎏金 +6 灵玉', '#B67B1B');
    } else if (forced) {
      addFloater(pos.x, pos.y - 24, '破阵抽离！', '#3F9E86');
    }

    // 双生锁链联动：搭档解链加分并减冰
    if (arrow.pairId > 0) {
      for (var pi = 0; pi < arrows.length; pi++) {
        var mate = arrows[pi];
        if (mate.alive && mate.pairId === arrow.pairId) {
          mate.pairId = 0;
          mate.pop = 1.24;
          score += 15;
          var mpos = cellCenter(mate.r, mate.c);
          if (mate.ice > 0) mate.ice = Math.max(0, mate.ice - 1);
          spawnParticles(mpos.x, mpos.y, '#E8BA52', 14);
          addFloater(mpos.x, mpos.y - 22, '双生解链 +15', '#B67B1B');
          sfxPairUnlock();
          break;
        }
      }
      arrow.pairId = 0;
    }

    // 破冰 + 拨雾显向联动
    var map = currentArrowMap();
    var cracked = false;
    var fullyMeltedAny = false;
    var mistRevealedAny = false;
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        var isOrth = (Math.abs(dr) + Math.abs(dc) === 1);
        if (arrow.kind !== 'bomb' && !isOrth) continue;
        var nb = map[(arrow.r + dr) + ',' + (arrow.c + dc)];
        if (!nb) continue;
        var npos = cellCenter(nb.r, nb.c);
        if (nb.ice > 0) {
          nb.ice = Math.max(0, nb.ice - 1);
          cracked = true;
          spawnParticles(npos.x, npos.y, '#9CCCD1', 10);
          if (nb.ice === 0) {
            fullyMeltedAny = true;
            addFloater(npos.x, npos.y - 16, '破冰解锁', '#3E7A91');
          }
        }
        if (nb.mist && isOrth) {
          nb.mist = false;
          nb.pop = 1.18;
          mistRevealedAny = true;
          spawnParticles(npos.x, npos.y, '#B7CFC8', 8);
          addFloater(npos.x, npos.y - 18, '拨雾显向', '#3F9E86');
        }
      }
    }
    if (cracked) sfxIce(fullyMeltedAny);
    if (mistRevealedAny && !cracked) sfxMistReveal();

    // 推进两步聚光灯教学
    if (tutorialStep === 1 && arrow.role === 'tut1') {
      tutorialStep = 2;
      trackEvent('jdqk_tutorial_step', { step: 1, done: 0 });

      showToast('已掌握精髓，一口气清空玉盘！');
    }

    // 胜利判定
    if (aliveCount() === 0) {
      onLevelWon();
    } else {
      saveInProgress(false);
    }

        lastRewardEarned = 20;

        save.lastDailyDate = td;
      }
      if (save.dailyDates.indexOf(td) === -1) save.dailyDates.push(td);
    } else {
      lastRewardEarned = boardSpec.reward;
    }

    save.jade += lastRewardEarned;
    save.clearedTotal += 1;
    if (maxComboThisRun > save.bestCombo) save.bestCombo = maxComboThisRun;

    // 每通 5 关自动免费补给跨局背包道具
    if (save.clearedTotal % 5 === 0) {
      save.bag.hint += 1;

    }

    // 推进主线与无尽进度 + 存星
    if (mode === 'campaign' || mode === 'endless') {
      if (level >= save.maxLevel) save.maxLevel = level + 1;
      var starKey = String(level);
      if (lastEarnedStars > (Number(save.levelStars[starKey]) || 0)) {
        save.levelStars[starKey] = lastEarnedStars;
        recalcStarsTotal();
      }
    }

    // 更新每日 3 任务进度
    var dTask = ensureDailyTasks();
    dTask.clears += 1;
    if (maxComboThisRun > dTask.maxCombo) dTask.maxCombo = maxComboThisRun;
    if (mode === 'daily') dTask.dailyCleared += 1;

    var runRec = {
      mode: mode, level: level, date: td, weekTag: wk,
      score: score, clearMs: lastClearMs, stars: lastEarnedStars,
      maxCombo: maxComboThisRun, updatedAt: nowMs
    };

    if (mode === 'daily') {
      var prevDaily = save.dailyRecords[td] || null;
      if (isBetterRankRecord(runRec, prevDaily)) {
        save.dailyRecords[td] = runRec;
        isNewLevelRecord = true;
      }
      cloudBridge.submitDailyStats(td, score, lastClearMs, mistakes, maxComboThisRun);
      cloudBridge.reportProvince('daily', td, score, lastClearMs);
    } else if (mode === 'weekly') {
      var wp = ensureWeeklyEntry(wk);
      var prevStage = wp.stageScores[String(level)];
      if (!prevStage || isBetterRankRecord(runRec, prevStage)) {
        wp.stageScores[String(level)] = { score: score, clearMs: lastClearMs, updatedAt: nowMs };
      }
      var sumScore = 0;
      var sumMs = 0;
      var stCleared = 0;
      for (var si = 1; si <= 5; si++) {
        var sr = wp.stageScores[String(si)];
        if (sr && sr.score > 0) {
          sumScore += sr.score;
          sumMs += sr.clearMs;
          stCleared++;
        }
      }
      wp.score = sumScore;
      wp.clearMs = sumMs;
      wp.stagesCleared = stCleared;
      wp.stage = Math.min(5, stCleared + 1);
      wp.updatedAt = nowMs;
      var wkSummary = {
        weekTag: wk, score: sumScore, clearMs: sumMs,
        stagesCleared: stCleared, tier: calcWeeklyTier(sumScore), updatedAt: nowMs
      };
      if (isBetterRankRecord(wkSummary, save.weeklyBest[wk])) {
        save.weeklyBest[wk] = wkSummary;
        isNewLevelRecord = true;
      }
      cloudBridge.submitWeekly(wp);
      cloudBridge.reportProvince('weekly', wk, sumScore, sumMs);
    } else {
      var lvKey = String(level);
      var prevLv = save.levelRecords[lvKey] || null;
      if (isBetterRankRecord(runRec, prevLv)) {
        save.levelRecords[lvKey] = runRec;
        isNewLevelRecord = true;
      }
    }

    if (isBetterRankRecord(runRec, save.bestRecord)) {
      save.bestRecord = {
        score: score, clearMs: lastClearMs,
        level: (mode === 'daily' || mode === 'weekly') ? 0 : level,
        mode: mode, updatedAt: nowMs
      };
      isNewBestRecord = true;
    }

    // 校验是否反超好友战书靶标
    if (shareTarget && (shareTarget.score > 0 || shareTarget.ms > 0)) {
      var targetRec = { score: shareTarget.score || 0, clearMs: shareTarget.ms || 999999999, updatedAt: 0 };
      if (isBetterRankRecord(runRec, targetRec)) {
        shareTarget.beaten = true;
        if (shareTarget.ms > 0 && lastClearMs < shareTarget.ms) {
          shareTarget.beatNote = '已超越好友战绩（快 ' + ((shareTarget.ms - lastClearMs) / 1000).toFixed(2) + ' 秒）！';
        } else {
          shareTarget.beatNote = '已超越好友战绩（高 ' + Math.max(0, score - (shareTarget.score || 0)) + ' 分）！';
        }
      } else {
        shareTarget.beaten = false;
        shareTarget.beatNote = '惜败好友一点点，再来一局反超！';
      }
    }

    save.recentRuns.unshift(runRec);
    if (save.recentRuns.length > 30) save.recentRuns.length = 30;
    save.inProgress = null;
    writeSave();
    syncWeChatCloudRank();
    cloudBridge.syncSave();
    trackEvent('jdqk_level_end', {
      mode: mode, level: level, result: 'win', score: score,
      clear_ms: lastClearMs, remaining: 0, stars: lastEarnedStars, mistakes: mistakes
    });

    var isGrandWin = !!(isNewBestRecord || (shareTarget && shareTarget.beaten) || lastDailyFirstClear || (mode === 'weekly' && isNewLevelRecord));
    sfxWinTier(lastEarnedStars, isGrandWin);
    spawnParticles(W * 0.5, H * 0.42, '#E8BA52', isGrandWin ? 46 : 32);
    spawnParticles(W * 0.5, H * 0.42, '#3F9E86', isGrandWin ? 32 : 22);
  }

  function handleArrowTap(arrow) {
    if (!arrow || !arrow.alive || phase !== 'playing') return;

    if (tutorialStep === 1 && arrow.role !== 'tut1') {
      showToast('先点金色光圈里的箭试试');
      return;
    }
    if (tutorialStep === 2 && arrow.role !== 'tut2b') {
      showToast('先清掉前方挡路的箭块');
      return;
    }

    // 破阵抽离模式：无视冰封/迷雾与阻挡强制移除
    if (removeMode) {
      removeMode = false;
      save.bag.remove = Math.max(0, save.bag.remove - 1);
      writeSave();
      arrow.ice = 0;
      arrow.mist = false;
      launchArrow(arrow, true);
      return;
    }

    // 隐向迷雾箭：轻点温和揭雾（不扣心）
    if (arrow.mist) {
      runStarted = true;
      arrow.mist = false;
      arrow.pop = 1.2;
      sfxMistReveal();
      var mpos = cellCenter(arrow.r, arrow.c);
      spawnParticles(mpos.x, mpos.y, '#B7CFC8', 10);
      addFloater(mpos.x, mpos.y - 20, '拨雾显向', '#3F9E86');
      saveInProgress(false);
      return;
    }

    // 冰封拦截
    if (arrow.ice > 0) {
      arrow.shake = 0.28;
      sfxBlocked();
      showToast('先清周围相邻箭即可破冰');
      return;
    }

    var map = currentArrowMap();
    var blocker = findBlockerInMap(map, boardSpec.gridSize, arrow.r, arrow.c, arrow.dir);
    if (!blocker) {
      launchArrow(arrow, false);
      return;
    }

    // 转向机关箭：受阻时不扣心，原地顺时针旋转 90°
    if (arrow.kind === 'rotator' && arrow.rotLeft > 0) {
      runStarted = true;
      arrow.dir = CW[arrow.dir];
      arrow.rotLeft -= 1;
      arrow.pop = 1.24;
      sfxRotate();
      var rpos = cellCenter(arrow.r, arrow.c);
      addFloater(rpos.x, rpos.y - 20, '罗盘转向', '#3F9E86');
      saveInProgress(false);
      return;
    }

    // 受阻红线脉冲警示
    var srcPos = cellCenter(arrow.r, arrow.c);
    var blkPos = cellCenter(blocker.r, blocker.c);
    blockedFlash = { x1: srcPos.x, y1: srcPos.y, x2: blkPos.x, y2: blkPos.y, life: 0.48, maxLife: 0.48 };
    arrow.shake = 0.34;
    blocker.shake = 0.22;

    // 开局护盾免扣首次失误
    if (shieldActive && tutorialStep === 0) {
      shieldActive = false;
      sfxShieldBlock();
      spawnShockwave(srcPos.x, srcPos.y, 120, '#4A7EB8');
      addFloater(srcPos.x, srcPos.y - 22, '玉盾抵挡失误！', '#315C8E');
      saveInProgress(false);
      return;
    }

    combo = 0;
    comboTimer = 0;
    qiCharge = 0;
    mistakes++;
    sfxBlocked();
    screenShake = 0.18;
    if (tutorialStep === 0) {
      hearts = Math.max(0, hearts - 1);
      addFloater(srcPos.x, srcPos.y - 20, '前方受阻 -1 心', '#D85C4B');
      if (hearts <= 0) {
        phase = 'lost';
        toastTimer = 0;
        floaters = [];
        clearInProgress();
        sfxLose(aliveCount() <= 5);
        trackEvent('jdqk_level_end', {
          mode: mode, level: level, result: 'lost_hearts', score: score,
          clear_ms: Math.round(runTime * 1000), remaining: aliveCount(), stars: 0, mistakes: mistakes
        });
      } else {
        saveInProgress(false);
      }
    }
  }

  function useHintTool() {
    if (phase !== 'playing') return;
    if (save.bag.hint <= 0) {
      triggerRewardAd('hint', function () {
        save.bag.hint += 2;
        writeSave();
        showToast('已补充天眼指路 ×2');
        useHintTool();
      });
      return;
    }
    var remaining = arrows.filter(function (a) { return a.alive; });
    var order = solveBoardOrder(boardSpec.gridSize, remaining);
    if (!order || !order.length) {
      showToast('试试破阵抽离打开局面');
      return;
    }
    save.bag.hint = Math.max(0, save.bag.hint - 1);
    writeSave();
    sfxHintTool();
    var topIds = order.slice(0, 3);
    for (var i = 0; i < arrows.length; i++) {
      if (topIds.indexOf(arrows[i].id) !== -1) arrows[i].hintGlow = 3.6;
    }
    saveInProgress(false);
    showToast('金色光环为推荐出箭顺序');
  }

  function useRemoveTool() {
    if (phase !== 'playing') return;
    if (removeMode) {
      removeMode = false;
      showToast('已取消破阵抽离');
      return;
    }
    if (save.bag.remove <= 0) {
      triggerRewardAd('remove', function () {
        save.bag.remove += 1;
        writeSave();
        removeMode = true;
        showToast('请点击任意一支箭直接抽离');
      });
      return;
    }
    removeMode = true;
    sfxClick();
    showToast('抽离已就绪：点任意箭直接清出');
  }

  function performGacha() {
    if (save.jade < R.gachaCost) {
      showToast('灵玉不足，通关或签到即可免费获取');
      sfxBlocked();
      return;
    }
    save.jade -= R.gachaCost;
    var roll = Math.random() * 100;
    var acc = 0;
    var pick = SKINS[1];
    for (var i = 1; i < SKINS.length; i++) {
      acc += SKINS[i].rate;
      if (roll < acc) { pick = SKINS[i]; break; }
    }
    var isDup = save.unlockedSkins.indexOf(pick.id) !== -1;
    if (!isDup) {
      save.unlockedSkins.push(pick.id);
      save.skinId = pick.id;
      gachaBanner = '喜获「' + pick.name + '」（' + pick.rarity + '），已自动换装！';
    } else {
      save.jade += 60;
      gachaBanner = '抽中已有「' + pick.name + '」，自动返还 60 灵玉';
    }
    writeSave();
    trackEvent('jdqk_gacha_draw', { action: 'draw', rarity: pick.rarity, is_dup: isDup ? 1 : 0 });
    sfxGachaReveal(pick.rarity, isDup);
  }

  function exchangeItemWithJade(itemKey, cost) {
    if (save.jade < cost) {
      showToast('灵玉不足，闯关与签到均可免费获得');
      sfxBlocked();
      return;
    }
    save.jade -= cost;
    if (itemKey === 'hint') save.bag.hint += 1;
    else save.bag.remove += 1;
    writeSave();
    trackEvent('jdqk_gacha_draw', { action: 'exchange_' + itemKey, rarity: '道具', is_dup: 0 });
    sfxRewardClaim();
    showToast(itemKey === 'hint' ? '已用免费灵玉兑换天眼指路 ×1' : '已用免费灵玉兑换破阵抽离 ×1');
  }

  function claimSignInToday() {
    var td = todaySeedInfo().tag;
    if (save.signIn.lastDate === td) {
      showToast('今日已签到，明日再来领下一重礼');
      return;
    }
    var nextDay = (save.signIn.claimedDays.length % 7) + 1;
    if (save.signIn.claimedDays.length >= 7) {
      save.signIn.claimedDays = [];
      nextDay = 1;
    }
    var rw = SIGN_IN_REWARDS[nextDay - 1];
    save.jade += rw.jade;
    save.bag.hint += rw.hint;
    save.bag.remove += rw.remove;
    save.signIn.lastDate = td;
    save.signIn.totalDays = (save.signIn.totalDays || 0) + 1;
    save.signIn.claimedDays.push(nextDay);
    writeSave();
    trackEvent('jdqk_sign_in_claim', { day: nextDay });
    sfxRewardClaim();
    showToast('第 ' + nextDay + ' 日签到成功：获 ' + rw.title);
  }

  function claimDailyTask(taskId, ready, jadeAdd, hintAdd, remAdd) {
    var dt = ensureDailyTasks();
    if (dt.claimed[taskId]) { showToast('该任务今日已领取'); return; }
    if (!ready) { showToast('尚未达成任务目标，加油破阵！'); sfxBlocked(); return; }
    dt.claimed[taskId] = true;
    save.jade += jadeAdd;
    save.bag.hint += hintAdd;
    save.bag.remove += remAdd;
    writeSave();
    trackEvent('jdqk_task_claim', { task_id: taskId });
    sfxRewardClaim();
    showToast('任务奖励已入账！');
  }

  function claimStarBox(milestone, doubled) {
    if (save.starsTotal < milestone) { showToast('累计星数不足，继续三星通关吧'); return; }
    if (save.starBoxClaimed.indexOf(milestone) !== -1) { showToast('该星辰宝箱已开启'); return; }
    var mult = doubled ? 2 : 1;
    save.starBoxClaimed.push(milestone);
    save.jade += 100 * mult;
    save.bag.hint += 1 * mult;
    save.bag.remove += 1;
    writeSave();
    sfxChestOpen();
    showToast('星辰宝箱开启！获 +' + (100 * mult) + ' 灵玉与道具');
  }

  function startLegendSkinTrial() {
    var pick = save.unlockedSkins.indexOf('qiankun') === -1 ? 'qiankun' : 'bamboo';
    triggerRewardAd('skin_trial', function () {
      trialSkinId = pick;
      var nextLv = save.tutorialDone ? save.maxLevel : 1;
      startLevel(nextLv, nextLv > 60 ? 'endless' : 'campaign', { keepTrial: true });
      showToast('已免费试穿传说皮肤「' + currentSkin().name + '」本局生效！');
    });

  /* 9. 按钮系统（果冻缩放动画） */
  function registerBtn(id, x, y, w, h, action) {
    activeButtons.push({ id: id, x: x, y: y, w: w, h: h, action: action });
  }
  function pressBtnAnim(id) { btnAnim[id] = 1.0; }
  function getBtnScale(id) {
    var t = btnAnim[id] || 0;
    if (t <= 0) return 1;
    if (t > 0.5) return 1 - (1 - (t - 0.5) * 2) * 0.08;
    return 1 + Math.sin((t / 0.5) * Math.PI) * 0.04;
  }

  /* 10. 宋韵青瓷绘图体系（纯 Canvas 2D 精雕玉牌 + 定制矢量器物图标 + 图形化机关） */
  function rr(x, y, w, h, r) { rrPath(ctx, x, y, w, h, r); }
  function rrPath(g, x, y, w, h, r) {
    var rad = Math.min(r, w * 0.5, h * 0.5);
    g.beginPath();
    g.moveTo(x + rad, y);
    g.lineTo(x + w - rad, y);
    g.quadraticCurveTo(x + w, y, x + w, y + rad);
    g.lineTo(x + w, y + h - rad);
    g.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
    g.lineTo(x + rad, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - rad);
    g.lineTo(x, y + rad);
    g.quadraticCurveTo(x, y, x + rad, y);
    g.closePath();
  }

  function formatTimerClock(sec) {
    var s = Math.max(0, Math.ceil(sec));
    var m = Math.floor(s / 60);
    var r = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }

  function drawVectorIcon(g, type, cx, cy, r, strokeCol, fillCol) {
    g.save();
    g.translate(cx, cy);
    g.strokeStyle = strokeCol || '#43584A';
    g.fillStyle = fillCol || strokeCol || '#43584A';
    g.lineCap = 'round';
    g.lineJoin = 'round';
    if (type === 'gear') {
      g.lineWidth = Math.max(2, r * 0.14);
      for (var gi = 0; gi < 8; gi++) {
        var ang = gi * Math.PI * 0.25;
        g.beginPath();
        g.moveTo(Math.cos(ang) * r * 0.58, Math.sin(ang) * r * 0.58);
        g.lineTo(Math.cos(ang) * r * 0.88, Math.sin(ang) * r * 0.88);
        g.stroke();
      }
      g.beginPath();
      g.arc(0, 0, r * 0.56, 0, Math.PI * 2);
      g.fillStyle = '#E6ECE2';
      g.fill();
      g.stroke();
      g.beginPath();
      g.arc(0, 0, r * 0.22, 0, Math.PI * 2);
      g.fillStyle = strokeCol || '#43584A';
      g.fill();
    } else if (type === 'home') {
      g.beginPath();
      g.moveTo(0, -r * 0.68);
      g.lineTo(r * 0.72, -r * 0.04);
      g.lineTo(r * 0.48, -r * 0.04);
      g.lineTo(r * 0.48, r * 0.62);
      g.lineTo(-r * 0.48, r * 0.62);
      g.lineTo(-r * 0.48, -r * 0.04);
      g.lineTo(-r * 0.72, -r * 0.04);
      g.closePath();
      g.fill();
      g.fillStyle = '#F5F4EC';
      rrPath(g, -r * 0.16, r * 0.14, r * 0.32, r * 0.48, 3);
      g.fill();
    } else if (type === 'eye') {
      g.lineWidth = Math.max(2.4, r * 0.12);
      g.beginPath();
      g.moveTo(-r * 0.78, 0);
      g.quadraticCurveTo(0, -r * 0.62, r * 0.78, 0);
      g.quadraticCurveTo(0, r * 0.62, -r * 0.78, 0);
      g.closePath();
      g.stroke();
      g.beginPath();
      g.arc(0, 0, r * 0.28, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = '#F6F5EC';
      g.beginPath();
      g.arc(-r * 0.08, -r * 0.08, r * 0.09, 0, Math.PI * 2);
      g.fill();
    } else if (type === 'spiral') {
      g.lineWidth = Math.max(2.6, r * 0.13);
      for (var sp = 0; sp < 3; sp++) {
        g.save();
        g.rotate(sp * Math.PI * 2 / 3);
        g.beginPath();
        g.arc(r * 0.22, -r * 0.14, r * 0.34, Math.PI * 0.75, Math.PI * 1.92);
        g.stroke();
        g.restore();
      }
      g.beginPath();
      g.arc(0, 0, r * 0.12, 0, Math.PI * 2);
      g.fill();
    } else if (type === 'retry') {
      g.lineWidth = Math.max(2.6, r * 0.14);
      g.beginPath();
      g.arc(0, 0, r * 0.56, -Math.PI * 0.72, Math.PI * 0.85);
      g.stroke();
      g.beginPath();
      g.moveTo(r * 0.28, -r * 0.68);
      g.lineTo(r * 0.66, -r * 0.38);
      g.lineTo(r * 0.24, -r * 0.24);
      g.closePath();
      g.fill();
    } else if (type === 'calendar') {
      g.lineWidth = 2.4;
      rrPath(g, -r * 0.68, -r * 0.54, r * 1.36, r * 1.22, r * 0.22);
      g.fillStyle = '#ECECE0';
      g.fill();
      g.stroke();
      rrPath(g, -r * 0.68, -r * 0.54, r * 1.36, r * 0.34, r * 0.18);
      g.fillStyle = '#6B9986';
      g.fill();
      g.beginPath();
      g.moveTo(-r * 0.34, -r * 0.72); g.lineTo(-r * 0.34, -r * 0.38);
      g.moveTo(r * 0.34, -r * 0.72); g.lineTo(r * 0.34, -r * 0.38);
      g.stroke();
      g.fillStyle = '#536A5C';
      for (var cr = 0; cr < 2; cr++) {
        for (var cc = 0; cc < 3; cc++) {
          g.fillRect(-r * 0.42 + cc * r * 0.34, -r * 0.02 + cr * r * 0.32, r * 0.18, r * 0.16);
        }
      }
    } else if (type === 'master') {
      g.lineWidth = 2.4;
      g.beginPath();
      g.arc(0, 0, r * 0.72, 0, Math.PI * 2);
      g.fillStyle = '#D5E1D4';
      g.fill();
      g.stroke();
      g.beginPath();
      g.moveTo(-r * 0.38, r * 0.24);
      g.lineTo(-r * 0.44, -r * 0.16);
      g.lineTo(-r * 0.16, r * 0.02);
      g.lineTo(0, -r * 0.34);
      g.lineTo(r * 0.16, r * 0.02);
      g.lineTo(r * 0.44, -r * 0.16);
      g.lineTo(r * 0.38, r * 0.24);
      g.closePath();
      g.fillStyle = '#C69D48';
      g.fill();
      g.strokeStyle = '#6B5528';
      g.lineWidth = 1.8;
      g.stroke();
    } else if (type === 'gift') {
      g.lineWidth = 2.4;
      rrPath(g, -r * 0.58, -r * 0.20, r * 1.16, r * 0.84, 5);
      g.stroke();
      rrPath(g, -r * 0.66, -r * 0.42, r * 1.32, r * 0.26, 4);
      g.stroke();
      g.beginPath();
      g.moveTo(0, -r * 0.42); g.lineTo(0, r * 0.64);
      g.moveTo(0, -r * 0.42); g.quadraticCurveTo(-r * 0.38, -r * 0.82, -r * 0.08, -r * 0.42);
      g.moveTo(0, -r * 0.42); g.quadraticCurveTo(r * 0.38, -r * 0.82, r * 0.08, -r * 0.42);
      g.stroke();
    } else if (type === 'shop') {
      g.lineWidth = 2.4;
      g.beginPath();
      g.arc(0, 0, r * 0.58, 0, Math.PI * 2);
      g.stroke();
      g.beginPath();
      g.arc(0, 0, r * 0.24, 0, Math.PI * 2);
      g.stroke();
      g.beginPath();
      g.moveTo(-r * 0.56, r * 0.56);
      g.lineTo(r * 0.58, -r * 0.58);
      g.stroke();
      g.beginPath();
      g.moveTo(r * 0.58, -r * 0.58);
      g.lineTo(r * 0.26, -r * 0.54);
      g.lineTo(r * 0.54, -r * 0.26);
      g.closePath();
      g.fill();
    } else if (type === 'rank') {
      g.lineWidth = 2.4;
      rrPath(g, -r * 0.66, r * 0.06, r * 0.40, r * 0.56, 3); g.stroke();
      rrPath(g, -r * 0.22, -r * 0.48, r * 0.44, r * 1.10, 3); g.stroke();
      rrPath(g, r * 0.26, -r * 0.14, r * 0.40, r * 0.76, 3); g.stroke();
    } else if (type === 'seal') {
      g.lineWidth = 2.4;
      g.beginPath();
      g.arc(0, 0, r * 0.62, 0, Math.PI * 2);
      g.stroke();
      g.beginPath();
      for (var si = 0; si < 8; si++) {
        var sa = si * Math.PI * 0.25;
        var sr = si % 2 === 0 ? r * 0.42 : r * 0.20;
        if (si === 0) g.moveTo(Math.cos(sa) * sr, Math.sin(sa) * sr);
        else g.lineTo(Math.cos(sa) * sr, Math.sin(sa) * sr);
      }
      g.closePath();
      g.fill();
    } else if (type === 'jade') {
      g.beginPath();
      g.arc(0, 0, r * 0.72, 0, Math.PI * 2);
      g.fillStyle = '#8FB9A4';
      g.fill();
      g.strokeStyle = '#4B7462';
      g.lineWidth = 2;
      g.stroke();
      g.beginPath();
      g.arc(0, 0, r * 0.24, 0, Math.PI * 2);
      g.fillStyle = '#EEF3EC';
      g.fill();
    }
    g.restore();
  }

  function drawJellyButton(id, x, y, w, h, label, sub, fill, darkFill, textColor, action, badgeDot) {
    registerBtn(id, x, y, w, h, action);

    ctx.translate(x + w * 0.5, y + h * 0.5);

    ctx.translate(-w * 0.5, -h * 0.5);

    var rad = Math.min(22, h * 0.36);
    rr(0, 4, w, h, rad);
    ctx.fillStyle = darkFill;
    ctx.fill();

    rr(0, 0, w, h, rad);
    var bgGrad = ctx.createLinearGradient(0, 0, 0, h);
    bgGrad.addColorStop(0, fill);
    bgGrad.addColorStop(1, darkFill);
    ctx.fillStyle = bgGrad;
    ctx.fill();

    // 温润宋瓷描金内细框 + 柔和高光（摒弃刺眼塑料反光条）
    rr(2, 2, w - 4, h - 4, Math.max(4, rad - 2));
    ctx.strokeStyle = 'rgba(247,242,226,0.45)';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    rr(10, 4, w - 20, h * 0.28, Math.max(4, rad * 0.5));
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fill();

    ctx.fillStyle = textColor || '#FFFFFF';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (sub) {
      ctx.font = 'bold ' + (w <= 180 ? 20 : 24) + 'px "PingFang SC","Microsoft YaHei",sans-serif';

      ctx.globalAlpha = 0.90;
      ctx.fillText(sub, w * 0.5, h * 0.72, w - 24);

      var fsz = w <= 110 ? 19 : (w <= 150 ? 20 : (w <= 200 ? 22 : 26));
      ctx.font = 'bold ' + fsz + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(label, w * 0.5, h * 0.51, w - 20);
    }
    if (badgeDot) {
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(w - 12, 12, 7.5, 0, Math.PI * 2);
      ctx.fillStyle = '#D85C4B';
      ctx.fill();
      ctx.strokeStyle = '#F7F5EC';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCircularMedallionBtn(id, cx, cy, r, iconType, label, badgeText, activeAccent, action) {
    registerBtn(id, cx - r - 10, cy - r - 6, (r + 10) * 2, r * 2 + (label ? 44 : 12), action);
    var sc = getBtnScale(id);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(sc, sc);

    // 底部温润玉盘阴影
    ctx.beginPath();
    ctx.arc(0, 5, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(46, 62, 52, 0.18)';
    ctx.fill();

    // 外圈羊脂玉环
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    var outerG = ctx.createLinearGradient(0, -r, 0, r);
    outerG.addColorStop(0, '#FAF9F2');
    outerG.addColorStop(1, '#E3E5D8');
    ctx.fillStyle = outerG;
    ctx.fill();
    ctx.strokeStyle = activeAccent ? '#D85C4B' : '#C6B389';
    ctx.lineWidth = activeAccent ? 3.2 : 2.2;
    ctx.stroke();

    // 内圈官窑青瓷玉扣
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.78, 0, Math.PI * 2);
    var innerG = ctx.createRadialGradient(-r * 0.2, -r * 0.25, r * 0.1, 0, 0, r * 0.82);
    if (activeAccent) {
      innerG.addColorStop(0, '#EA8B7B');
      innerG.addColorStop(1, '#C94E3E');
    } else {
      innerG.addColorStop(0, '#DCE7DE');
      innerG.addColorStop(1, '#B3C6B8');
    }
    ctx.fillStyle = innerG;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    drawVectorIcon(ctx, iconType, 0, 0, r * 0.46, activeAccent ? '#FCFBF5' : '#3C5447', activeAccent ? '#FCFBF5' : '#3C5447');

    // 右下精致小圆数字角标
    if (badgeText !== null && badgeText !== undefined && badgeText !== '') {
      var bx = r * 0.66;
      var by = r * 0.62;
      ctx.beginPath();
      ctx.arc(bx, by, 17, 0, Math.PI * 2);
      ctx.fillStyle = badgeText === '补' ? '#C98F2C' : '#3D6E5E';
      ctx.fill();
      ctx.strokeStyle = '#FAF9F2';
      ctx.lineWidth = 2.4;
      ctx.stroke();
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 17px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(badgeText), bx, by + 1);
    }

    if (label) {
      ctx.fillStyle = activeAccent ? '#C94E3E' : '#324438';
      ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 0, r + 26);
    }
    ctx.restore();
  }

  function drawBoardPattern(skin, rect) {
    ctx.save();
    rr(rect.x, rect.y, rect.size, rect.size, 28);
    ctx.clip();
    ctx.strokeStyle = skin.boardBorder;
    ctx.globalAlpha = 0.14;
    ctx.lineWidth = 1.8;
    if (skin.pattern === 'orbit' || skin.pattern === 'ripple') {
      ctx.beginPath();
      ctx.arc(rect.x + rect.size * 0.5, rect.y + rect.size * 0.5, rect.size * 0.38, 0, Math.PI * 2);
      ctx.arc(rect.x + rect.size * 0.5, rect.y + rect.size * 0.5, rect.size * 0.24, 0, Math.PI * 2);
      ctx.stroke();
    } else if (skin.pattern === 'bamboo') {
      for (var bx = rect.x + 60; bx < rect.x + rect.size; bx += 78) {
        ctx.beginPath();
        ctx.moveTo(bx, rect.y);
        ctx.lineTo(bx, rect.y + rect.size);
        ctx.stroke();
      }
    } else if (skin.pattern === 'stars') {
      ctx.fillStyle = skin.boardBorder;
      for (var si = 0; si < 12; si++) {
        var sx = rect.x + ((si * 97 + 40) % (rect.size - 60)) + 30;
        var sy = rect.y + ((si * 131 + 50) % (rect.size - 60)) + 30;
        ctx.beginPath();
        ctx.arc(sx, sy, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawArrowTile(g, cx, cy, size, dir, kind, ice, rotLeft, skin, glowAlpha, pairId, mist) {
    var pad = size * 0.065;
    var s = size - pad * 2;
    var half = s * 0.5;
    var rad = s * 0.20;
    var arrowCol = skin.dirs[dir];
    var arrowDark = skin.dirsDark[dir];
    var bodyTop = skin.tileBody || '#F7F6EE';
    var bodyBot = skin.cellFill || '#E7E7DB';
    var edgeCol = skin.tileEdge || '#C9C4B0';
    var rimCol = skin.tileRim || 'rgba(199, 178, 135, 0.72)';

    if (!mist && kind === 'gold') {
      bodyTop = '#FDF4D5';
      bodyBot = '#EDD693';
      edgeCol = '#B9923F';
      rimCol = '#D4A742';
      arrowCol = '#C98A1A';
      arrowDark = '#8E5E0B';
    } else if (!mist && kind === 'bomb') {
      bodyTop = '#FBF0EC';
      bodyBot = '#EFE0D9';
      edgeCol = '#C6978B';
      rimCol = '#D87562';
      arrowCol = '#C94638';
      arrowDark = '#8E281E';
    }

    g.save();
    g.translate(cx, cy);

    // 提示流光金环
    if (glowAlpha > 0) {
      g.save();
      g.globalAlpha = glowAlpha;
      rrPath(g, -half - 4, -half - 4, s + 8, s + 8, rad + 4);
      g.strokeStyle = '#E8BA52';
      g.lineWidth = 6;
      g.stroke();
      g.restore();
    }

    // 双生锁链玉牌淡金外晕
    if (pairId > 0 && !mist) {
      g.save();
      rrPath(g, -half - 2, -half - 2, s + 4, s + 4, rad + 2);
      g.strokeStyle = 'rgba(222, 173, 66, 0.75)';
      g.lineWidth = 2.6;
      g.stroke();
      g.restore();
    }

    // 1. 宋瓷玉牌厚底立体阴影
    rrPath(g, -half, -half + Math.max(3, s * 0.055), s, s, rad);
    g.fillStyle = edgeCol;
    g.fill();

    // 2. 温润羊脂釉面牌体（零每格动态渐变分配，60 FPS 丝滑且瓷釉温润）
    rrPath(g, -half, -half, s, s, rad);
    g.fillStyle = bodyTop;
    g.fill();
    rrPath(g, -half + s * 0.04, 0, s * 0.92, half - s * 0.04, rad * 0.7);
    g.fillStyle = bodyBot;
    g.globalAlpha = 0.42;
    g.fill();
    g.globalAlpha = 1;

    // 细描金包边与瓷釉柔光
    rrPath(g, -half, -half, s, s, rad);
    g.strokeStyle = rimCol;
    g.lineWidth = Math.max(1.2, s * 0.022);
    g.stroke();

    rrPath(g, -half + s * 0.09, -half + s * 0.06, s * 0.82, s * 0.24, rad * 0.5);
    g.fillStyle = 'rgba(255,255,255,0.52)';
    g.fill();

    // 3. 特殊底纹：转向箭 -> 精雕古铜罗盘八向纹
    if (!mist && kind === 'rotator' && rotLeft > 0) {
      g.save();
      g.beginPath();
      g.arc(0, 0, s * 0.37, 0, Math.PI * 2);
      var brGrad = g.createRadialGradient(-s * 0.1, -s * 0.1, s * 0.04, 0, 0, s * 0.39);
      brGrad.addColorStop(0, '#D4B882');
      brGrad.addColorStop(1, '#8D7242');
      g.fillStyle = brGrad;
      g.fill();
      g.strokeStyle = '#6A532B';
      g.lineWidth = 1.6;
      g.stroke();
      // 8 向细刻度
      g.strokeStyle = 'rgba(255,248,225,0.68)';
      g.lineWidth = 1.2;
      for (var ri = 0; ri < 8; ri++) {
        var ra = ri * Math.PI * 0.25;
        g.beginPath();
        g.moveTo(Math.cos(ra) * s * 0.24, Math.sin(ra) * s * 0.24);
        g.lineTo(Math.cos(ra) * s * 0.34, Math.sin(ra) * s * 0.34);
        g.stroke();
      }
      g.restore();
    }

    // 4. 图形主体：迷雾云烟团 OR 精雕羽箭浮雕
    if (mist) {
      var drift = Math.sin(elapsed * 2.2 + cx * 0.05) * s * 0.025;
      g.save();
      g.translate(drift, 0);
      // 层叠水墨青雾团（零僵硬汉字，直觉可读！）
      var puffs = [
        [-0.14, 0.06, 0.21, 'rgba(134, 148, 140, 0.62)'],
        [0.14, 0.07, 0.19, 'rgba(120, 136, 128, 0.58)'],
        [0.0, -0.08, 0.23, 'rgba(164, 176, 168, 0.78)'],
        [-0.08, -0.02, 0.16, 'rgba(218, 224, 218, 0.85)'],
        [0.10, -0.02, 0.14, 'rgba(205, 214, 208, 0.82)']
      ];
      for (var pi = 0; pi < puffs.length; pi++) {
        g.beginPath();
        g.arc(puffs[pi][0] * s, puffs[pi][1] * s, puffs[pi][2] * s, 0, Math.PI * 2);
        g.fillStyle = puffs[pi][3];
        g.fill();
      }
      g.restore();
    } else {
      // 精雕修长国风箭矢浮雕（带尖锐箭镞 + 收腰箭杆 + 燕尾羽凹口）
      g.save();
      var angles = [-Math.PI * 0.5, Math.PI * 0.5, Math.PI, 0];
      g.rotate(angles[dir]);
      var aw = s * 0.31;
      var ah = s * 0.24;
      var drawSculptArrow = function (oy, fillC) {
        g.beginPath();
        g.moveTo(aw, oy);                  // 箭尖
        g.lineTo(-aw * 0.06, oy - ah);     // 上翼尖
        g.lineTo(-aw * 0.06, oy - ah * 0.38);
        g.lineTo(-aw * 0.94, oy - ah * 0.38); // 箭尾上沿
        g.lineTo(-aw * 0.72, oy);          // 羽尾微凹
        g.lineTo(-aw * 0.94, oy + ah * 0.38); // 箭尾下沿
        g.lineTo(-aw * 0.06, oy + ah * 0.38);
        g.lineTo(-aw * 0.06, oy + ah);     // 下翼尖
        g.closePath();
        g.fillStyle = fillC;
        g.fill();
      };
      var useLightArrow = (kind === 'rotator' && rotLeft > 0);
      drawSculptArrow(Math.max(1.5, s * 0.03), useLightArrow ? 'rgba(65,48,20,0.45)' : arrowDark);
      drawSculptArrow(0, useLightArrow ? '#FFF6DC' : arrowCol);
      // 箭身细柔高光筋线
      g.strokeStyle = useLightArrow ? 'rgba(255,255,255,0.75)' : 'rgba(255,255,255,0.34)';
      g.lineWidth = Math.max(1.2, s * 0.025);
      g.beginPath();
      g.moveTo(-aw * 0.62, 0);
      g.lineTo(aw * 0.55, 0);
      g.stroke();
      g.restore();
    }

    // 5. 精致纯图形特殊徽记（告别角落乱贴汉字）
    if (!mist && kind === 'gold') {
      // 四芒星流金高光点
      var gx = half - s * 0.20;
      var gy = -half + s * 0.20;
      var gr = s * 0.11;
      g.fillStyle = '#E8A825';
      g.beginPath();
      g.moveTo(gx, gy - gr); g.lineTo(gx + gr * 0.35, gy - gr * 0.35);
      g.lineTo(gx + gr, gy); g.lineTo(gx + gr * 0.35, gy + gr * 0.35);
      g.lineTo(gx, gy + gr); g.lineTo(gx - gr * 0.35, gy + gr * 0.35);
      g.lineTo(gx - gr, gy); g.lineTo(gx - gr * 0.35, gy - gr * 0.35);
      g.closePath();
      g.fill();
    } else if (!mist && kind === 'bomb') {
      // 精致赤金闪电徽记
      var lx = half - s * 0.21;
      var ly = -half + s * 0.21;
      var lr = s * 0.12;
      g.fillStyle = '#E8A825';
      g.beginPath();
      g.moveTo(lx + lr * 0.2, ly - lr);
      g.lineTo(lx - lr * 0.6, ly + lr * 0.1);
      g.lineTo(lx, ly + lr * 0.1);
      g.lineTo(lx - lr * 0.2, ly + lr);
      g.lineTo(lx + lr * 0.6, ly - lr * 0.1);
      g.lineTo(lx, ly - lr * 0.1);
      g.closePath();
      g.fill();
    } else if (pairId > 0 && !mist) {
      // 精致双金环锁扣徽记
      var px = half - s * 0.20;
      var py = -half + s * 0.20;
      g.strokeStyle = '#C9942A';
      g.lineWidth = Math.max(1.5, s * 0.028);
      g.beginPath(); g.arc(px - s * 0.04, py, s * 0.075, 0, Math.PI * 2); g.stroke();
      g.beginPath(); g.arc(px + s * 0.04, py, s * 0.075, 0, Math.PI * 2); g.stroke();
    }

    // 6. 冰封状态：宋瓷冰裂青釉罩 + 精致白裂纹 + 微型冰层玉珠
    if (ice > 0) {
      rrPath(g, -half, -half, s, s, rad);
      var iceGrad = g.createLinearGradient(-half, -half, half, half);
      iceGrad.addColorStop(0, 'rgba(186, 224, 224, 0.72)');
      iceGrad.addColorStop(0.55, 'rgba(142, 192, 198, 0.56)');
      iceGrad.addColorStop(1, 'rgba(118, 174, 184, 0.70)');
      g.fillStyle = iceGrad;
      g.fill();
      g.strokeStyle = 'rgba(240, 250, 252, 0.88)';
      g.lineWidth = 2;
      g.stroke();

      // 细腻冰裂釉纹
      g.strokeStyle = 'rgba(255, 255, 255, 0.68)';
      g.lineWidth = 1.25;
      g.beginPath();
      g.moveTo(-half + s * 0.18, -half + s * 0.12);
      g.lineTo(-s * 0.06, -s * 0.04);
      g.lineTo(s * 0.16, -s * 0.18);
      g.moveTo(-s * 0.06, -s * 0.04);
      g.lineTo(-s * 0.20, s * 0.24);
      g.moveTo(-s * 0.06, -s * 0.04);
      g.lineTo(s * 0.26, s * 0.16);
      g.stroke();

      // 右下微雅冰层玉珠（清晰标明剩余 1/2 层冰封）
      var ix = half - s * 0.20;
      var iy = half - s * 0.20;
      g.beginPath();
      g.arc(ix, iy, s * 0.15, 0, Math.PI * 2);
      g.fillStyle = 'rgba(43, 88, 102, 0.86)';
      g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.85)';
      g.lineWidth = 1.4;
      g.stroke();
      g.fillStyle = '#FFFFFF';
      g.font = 'bold ' + Math.round(s * 0.19) + 'px sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(String(ice), ix, iy + 0.5);
    }
    g.restore();
  }

      var bx = -offsetX / (scale || 1) - 8;

      var bh = viewH / (scale || 1) + 16;

      if (boxAr > imgAr) {

  function drawBoardAndArrows(skin) {
    var rect = getBoardRect();
    var pad = 20;
    var inner = rect.size - pad * 2;
    var cell = inner / boardSpec.gridSize;

    // 宋瓷玉盘双层描金底座与柔和投影
    rr(rect.x, rect.y + 9, rect.size, rect.size, 28);
    ctx.fillStyle = 'rgba(46, 62, 52, 0.14)';
    ctx.fill();

    rr(rect.x, rect.y, rect.size, rect.size, 28);
    var brdG = ctx.createLinearGradient(rect.x, rect.y, rect.x, rect.y + rect.size);
    brdG.addColorStop(0, skin.boardFill);
    brdG.addColorStop(1, '#ECECE0');
    ctx.fillStyle = brdG;
    ctx.fill();
    drawBoardPattern(skin, rect);
    ctx.strokeStyle = removeMode ? '#D85C4B' : skin.boardBorder;
    ctx.lineWidth = removeMode ? 4.5 : 3.5;
    ctx.stroke();

    rr(rect.x + 8, rect.y + 8, rect.size - 16, rect.size - 16, 22);
    ctx.strokeStyle = 'rgba(201, 181, 140, 0.46)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // 棋格温润内凹玉槽
    for (var r = 0; r < boardSpec.gridSize; r++) {
      for (var c = 0; c < boardSpec.gridSize; c++) {
        var gx = rect.x + pad + c * cell + 4;
        var gy = rect.y + pad + r * cell + 4;
        rr(gx, gy, cell - 8, cell - 8, Math.min(16, cell * 0.20));
        ctx.fillStyle = skin.cellFill;
        ctx.fill();
      }
    }

    // 双生锁链发光金丝连线（绘在箭块下方）
    var pairSeen = {};
    for (var pi = 0; pi < arrows.length; pi++) {
      var pa = arrows[pi];
      if (!pa.alive || !pa.pairId) continue;
      if (!pairSeen[pa.pairId]) {
        pairSeen[pa.pairId] = pa;
      } else {
        var p1 = cellCenter(pairSeen[pa.pairId].r, pairSeen[pa.pairId].c);
        var p2 = cellCenter(pa.r, pa.c);
        ctx.save();
        ctx.strokeStyle = 'rgba(232, 186, 82, 0.35)';
        ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        ctx.setLineDash([7, 5]);
        ctx.strokeStyle = '#D9A032';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
        ctx.restore();
      }
    }

    // 静止箭块
    for (var i = 0; i < arrows.length; i++) {
      var a = arrows[i];
      if (!a.alive) continue;
      var pos = cellCenter(a.r, a.c);
      var sx = a.shake > 0 ? Math.sin(a.shake * 70) * 8 : 0;
      var glow = a.hintGlow > 0 ? (0.55 + Math.sin(elapsed * 10) * 0.35) : 0;
      ctx.save();
      ctx.translate(pos.x + sx, pos.y);
      ctx.scale(a.pop, a.pop);
      drawArrowTile(ctx, 0, 0, pos.cell, a.dir, a.kind, a.ice, a.rotLeft, skin, glow, a.pairId, a.mist);
      ctx.restore();
    }

    // 受阻红线警示脉冲
    if (blockedFlash && blockedFlash.life > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, blockedFlash.life / blockedFlash.maxLife);
      ctx.strokeStyle = '#D85C4B';
      ctx.lineWidth = 6;
      ctx.setLineDash([10, 7]);
      ctx.beginPath();
      ctx.moveTo(blockedFlash.x1, blockedFlash.y1);
      ctx.lineTo(blockedFlash.x2, blockedFlash.y2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(blockedFlash.x2, blockedFlash.y2, 22, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // 雷箭与箭气冲击波光环
    for (var swi = 0; swi < shockwaves.length; swi++) {
      var sw = shockwaves[swi];
      ctx.save();
      ctx.globalAlpha = Math.max(0, sw.life / sw.maxLife) * 0.8;
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = 7 * (sw.life / sw.maxLife);
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // 飞出温润流金丝带箭块
    for (var f = 0; f < flying.length; f++) {
      var fl = flying[f];
      if (fl.trail.length > 1) {
        ctx.save();
        var trGrad = ctx.createLinearGradient(fl.trail[0].x, fl.trail[0].y, fl.x, fl.y);
        trGrad.addColorStop(0, 'rgba(232, 186, 82, 0.04)');
        trGrad.addColorStop(1, 'rgba(238, 198, 102, 0.72)');
        ctx.strokeStyle = trGrad;
        ctx.lineWidth = fl.cell * 0.28;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(fl.trail[0].x, fl.trail[0].y);
        for (var ti = 1; ti < fl.trail.length; ti++) ctx.lineTo(fl.trail[ti].x, fl.trail[ti].y);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255, 249, 226, 0.85)';
        ctx.lineWidth = fl.cell * 0.09;
        ctx.stroke();
        ctx.restore();
      }
      drawArrowTile(ctx, fl.x, fl.y, fl.cell * 0.94, fl.dir, fl.kind, 0, 0, skin, 0.3, 0, false);
    }

    // 盘底流光「箭气」能量槽（每日一局开局首步前此处展示雅玉护盾按钮，零遮挡盘面）
    var statusY = 1006;
    if (mode === 'daily' && !shieldActive && mistakes === 0 && !runStarted && !modal && phase === 'playing') {
      drawCeladonHeroBtn('btn_daily_shield', 62, statusY - 31, W - 124, 62, '开启每日玉盾（免扣首失误）', getRewardTag('shield', '看视频开启', '首发限免 · 立即生效'), function () {

  function drawSpotlightTutorial() {
    if (phase !== 'playing' || modal || tutorialStep <= 0) return;
    var targetRole = tutorialStep === 1 ? 'tut1' : 'tut2b';
    var target = null;
    var blocked = null;
    for (var i = 0; i < arrows.length; i++) {
      if (arrows[i].role === targetRole && arrows[i].alive) target = arrows[i];
      if (arrows[i].role === 'tut2a' && arrows[i].alive) blocked = arrows[i];
    }
    if (!target) { tutorialStep = 0; return; }
    var pos = cellCenter(target.r, target.c);
    var pulse = 1 + Math.sin(elapsed * 6) * 0.08;

    ctx.save();
    ctx.fillStyle = 'rgba(18, 32, 26, 0.42)';
    ctx.fillRect(-200, -400, W + 400, H + 800);

    if (tutorialStep === 2 && blocked) {
      var bpos = cellCenter(blocked.r, blocked.c);
      drawArrowTile(ctx, bpos.x, bpos.y, bpos.cell, blocked.dir, blocked.kind, 0, 0, currentSkin(), 0, 0, false);
      ctx.save();
      ctx.setLineDash([8, 6]);
      ctx.strokeStyle = '#FF6B6B';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(bpos.x + bpos.cell * 0.2, bpos.y);
      ctx.lineTo(pos.x - pos.cell * 0.2, pos.y);
      ctx.stroke();
      ctx.restore();
    }

    drawArrowTile(ctx, pos.x, pos.y, pos.cell, target.dir, target.kind, 0, 0, currentSkin(), 0, 0, false);
    ctx.strokeStyle = '#FFD452';
    ctx.lineWidth = 8;
    rr(pos.x - pos.cell * 0.52 * pulse, pos.y - pos.cell * 0.52 * pulse, pos.cell * 1.04 * pulse, pos.cell * 1.04 * pulse, 24);
    ctx.stroke();

    var tip = tutorialStep === 1 ? '第一步：点它飞出阵' : '第二步：先清挡路箭';
    var tipY = pos.y - pos.cell * 0.92;
    if (tipY < 260) tipY = pos.y + pos.cell * 0.95;
    rr(W * 0.5 - 190, tipY - 34, 380, 68, 34);
    ctx.fillStyle = '#FFD452';
    ctx.fill();
    ctx.fillStyle = '#234236';
    ctx.font = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tip, W * 0.5, tipY + 1);
    ctx.restore();

          ctx.font = 'bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
          ctx.fillText(formatDurationZh(showBest.clearMs), listX + listW - 18, fy2 + 37);
        } else {
          ctx.fillText('通关任意阵局，立即记录分数与通关耗时', listX + 20, fy2 + 26);
          ctx.fillStyle = '#9BC6B3';
          ctx.font = '600 16px "PingFang SC","Microsoft YaHei",sans-serif';
          ctx.fillText('微信小游戏版自动同步微信好友排行', listX + 20, fy2 + 52);
        }
      }

      var ctrlY = my + 662;
      drawJellyButton('rank_prev', listX, ctrlY, 124, 58, '上一页', null, '#8CA196', '#62766C', '#FFFFFF', function () {
        if (rankTab !== 'levels' && getWxOpenDataContext()) {
          try { getWxOpenDataContext().postMessage({ type: 'page', delta: -1 }); } catch (_e) {}
        } else {
          rankPage = Math.max(0, rankPage - 1);
        }
        sfxClick();
      });
      drawJellyButton('rank_share', listX + 138, ctrlY, 264, 58, '邀好友比拼耗时', null, '#E9A626', '#B37A10', '#FFFFFF', triggerRankShare);
      drawJellyButton('rank_next', listX + 416, ctrlY, 124, 58, '下一页', null, '#8CA196', '#62766C', '#FFFFFF', function () {
        if (rankTab !== 'levels' && getWxOpenDataContext()) {
          try { getWxOpenDataContext().postMessage({ type: 'page', delta: 1 }); } catch (_e) {}
        } else {
          rankPage += 1;
        }
        sfxClick();
      });

      drawJellyButton('close_modal', mx + 140, my + 748, mw - 280, 68, '关闭返回', null, '#607D70', '#41574D', '#FFFFFF', closeRankModal);
    }
    ctx.restore();
  }

  function drawEffects() {
    for (var p = 0; p < particles.length; p++) {
      var pt = particles[p];
      ctx.save();
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    for (var f = 0; f < floaters.length; f++) {
      var fl = floaters[f];
      ctx.save();
      ctx.globalAlpha = Math.max(0, fl.life / fl.maxLife);
      ctx.font = '900 28px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(fl.text, fl.x + 2, fl.y + 2);
      ctx.fillStyle = fl.color;
      ctx.fillText(fl.text, fl.x, fl.y);
      ctx.restore();
    }
    if (toastTimer > 0 && toastText) {
      var ty = modal ? 116 : (phase === 'playing' ? 1222 : 216);
      ctx.save();
      ctx.globalAlpha = Math.min(1, toastTimer * 2);
      rr(W * 0.5 - 266, ty, 532, 46, 23);
      ctx.fillStyle = 'rgba(34, 54, 45, 0.94)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(215, 196, 154, 0.72)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.fillStyle = '#FCF9F0';
      ctx.font = 'bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(toastText, W * 0.5, ty + 24);
      ctx.restore();
    }
  }

  /* 13. 输入事件（单手触控 + 鼠标 + 键盘 Enter 启动） */
  function toLogical(clientX, clientY) {
    var rect = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : { left: 0, top: 0 };
    var lx = (clientX - rect.left - offsetX) / (scale || 1);
    var ly = (clientY - rect.top - offsetY) / (scale || 1);
    return { x: lx, y: ly };
  }

  function handleTap(lx, ly) {
    unlockAudio();
    for (var i = activeButtons.length - 1; i >= 0; i--) {
      var b = activeButtons[i];
      if (lx >= b.x && lx <= b.x + b.w && ly >= b.y && ly <= b.y + b.h) {
        pressBtnAnim(b.id);
        b.action();
        return;
      }
    }
    if (modal) return;
    if (phase === 'title') {
      if (R.level === 1 && getValidInProgress()) {
        resumeSavedProgress();
        return;
      }
      var nextLv = R.level > 1 ? R.level : (save.tutorialDone ? (save.maxLevel || 1) : 1);
      startLevel(nextLv, R.mode === 'daily' ? 'daily' : (nextLv > 60 ? 'endless' : R.mode));
      return;
    }
    if (phase !== 'playing' || !boardSpec) return;

    var rect = getBoardRect();
    var pad = 20;
    var inner = rect.size - pad * 2;
    var cell = inner / boardSpec.gridSize;
    var c = Math.floor((lx - (rect.x + pad)) / cell);
    var r = Math.floor((ly - (rect.y + pad)) / cell);
    if (r < 0 || r >= boardSpec.gridSize || c < 0 || c >= boardSpec.gridSize) return;
    for (var a = 0; a < arrows.length; a++) {
      if (arrows[a].alive && arrows[a].r === r && arrows[a].c === c) {
        handleArrowTap(arrows[a]);
        return;
      }
    }
  }

  canvas.addEventListener('pointerdown', function (ev) {
    if (ev && typeof ev.preventDefault === 'function') ev.preventDefault();
    var pt = toLogical(ev.clientX, ev.clientY);
    handleTap(pt.x, pt.y);
  });

  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('keydown', function (ev) {
      if (!ev) return;
      if (ev.key === 'Enter' || ev.key === ' ') {
        unlockAudio();
        if (phase === 'title') {
          if (R.level === 1 && getValidInProgress()) resumeSavedProgress();
          else {
            var nextLv = save.tutorialDone ? (save.maxLevel || 1) : 1;
            startLevel(nextLv, nextLv > 60 ? 'endless' : 'campaign');
          }
        } else if (phase === 'won' || phase === 'lost') {
          var targetLv = phase === 'won' ? (mode === 'weekly' ? Math.min(5, level + 1) : level + 1) : level;
          startLevel(targetLv, targetLv > 60 && mode === 'campaign' ? 'endless' : mode);
        }
      }
    });
  }

  /* 14. 主循环与动画更新 */
  function update(dt) {
    elapsed += dt;
    if (toastTimer > 0) toastTimer = Math.max(0, toastTimer - dt);
    if (mechanicTipTimer > 0) mechanicTipTimer = Math.max(0, mechanicTipTimer - dt);
    if (screenShake > 0) screenShake = Math.max(0, screenShake - dt);
    if (blockedFlash) {
      blockedFlash.life -= dt;
      if (blockedFlash.life <= 0) blockedFlash = null;
    }
    for (var bk in btnAnim) {
      if (btnAnim[bk] > 0) btnAnim[bk] = Math.max(0, btnAnim[bk] - dt * 5.2);
    }

    if (phase === 'playing' && !modal) {
      if (tutorialStep === 0 || runStarted) runTime += dt;
      if (tutorialStep === 0) {
        timeLeft = Math.max(0, timeLeft - dt);
        if (timeLeft <= 0) {
          phase = 'lost';
          clearInProgress();
          sfxLose(aliveCount() <= 5);
          trackEvent('jdqk_level_end', {
            mode: mode, level: level, result: 'lost_timeout', score: score,
            clear_ms: Math.round(runTime * 1000), remaining: aliveCount(), stars: 0, mistakes: mistakes
          });
        }
      }
      if (comboTimer > 0) {
        comboTimer = Math.max(0, comboTimer - dt);
        if (comboTimer === 0) { combo = 0; qiCharge = 0; }
      }
      if (phase === 'playing' && runStarted) {
        autoSaveTimer += dt;
        if (autoSaveTimer >= 3.0) {
          autoSaveTimer = 0;
          saveInProgress(false);
        }
      }
    }

    for (var i = 0; i < arrows.length; i++) {
      var a = arrows[i];
      if (a.shake > 0) a.shake = Math.max(0, a.shake - dt);
      if (a.hintGlow > 0) a.hintGlow = Math.max(0, a.hintGlow - dt);
      if (a.pop > 1) a.pop = Math.max(1, a.pop - dt * 2.4);
    }

    for (var swi = shockwaves.length - 1; swi >= 0; swi--) {
      var sw = shockwaves[swi];
      sw.life -= dt;
      sw.r += (sw.maxR / sw.maxLife) * dt;
      if (sw.life <= 0) shockwaves.splice(swi, 1);
    }

    for (var f = flying.length - 1; f >= 0; f--) {
      var fl = flying[f];
      fl.x += fl.vx * dt;
      fl.y += fl.vy * dt;
      fl.trail.push({ x: fl.x, y: fl.y });
      if (fl.trail.length > 7) fl.trail.shift();
      if (fl.x < -120 || fl.x > W + 120 || fl.y < -120 || fl.y > H + 120) flying.splice(f, 1);
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 260 * dt; pt.life -= dt;
      if (pt.life <= 0) particles.splice(p, 1);
    }

    for (var fli = floaters.length - 1; fli >= 0; fli--) {
      var fo = floaters[fli];
      fo.y -= 55 * dt; fo.life -= dt;
      if (fo.life <= 0) floaters.splice(fli, 1);
    }
  }

  function render() {
    var skin = currentSkin();
    activeButtons = [];

    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var fullGrad = ctx.createLinearGradient(0, 0, 0, viewH);
    fullGrad.addColorStop(0, skin.bgTop);
    fullGrad.addColorStop(1, skin.bgBot);
    ctx.fillStyle = fullGrad;
    ctx.fillRect(0, 0, viewW, viewH);

    var shx = screenShake > 0 ? Math.sin(elapsed * 90) * 6 : 0;
    ctx.translate(offsetX + shx, offsetY);
    ctx.scale(scale, scale);

    drawBackground(skin);
    if (phase === 'title') {
      drawTitleScreen(skin);
    } else {
      drawHud(skin);
      drawBoardAndArrows(skin);
      drawSpotlightTutorial();
      drawResultOverlay(skin);
    }
    drawModalOverlay(skin);
    drawEffects();
    ctx.restore();
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
    lastTs = ts;
    fpsFrames++; fpsAccum += dt;
    if (fpsAccum >= 0.5) {
      fps = Math.round(fpsFrames / fpsAccum);
      fpsFrames = 0; fpsAccum = 0;
    }
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* 15. 微信分享（动态 5:4 战报 + 朋友圈 1:1 + 好友战书 query 靶向 PK）与自动试玩契约 */
  function buildShareMeta(channel) {
    var isTimeline = channel === 'timeline';
    var src = isTimeline ? 'timeline' : 'friend';
    var cfg = getWxConfig();
    var img = isTimeline
      ? (cfg.timelineImageUrl || 'images/share-timeline.jpg')
      : (lastSharePosterPath || cfg.shareImageUrl || 'images/share-cover.jpg');
    var tdBest = getTodayDailyBest();
    if (mode === 'daily' && phase === 'won') {
      return {
        title: '我在《' + TITLE + '》今日同盘拿下 ' + score + ' 分、耗时 ' + formatDurationZh(lastClearMs) + '，敢来破我纪录吗？',
        imageUrl: img,
        query: 'mode=daily&src=' + src + '&score=' + score + '&ms=' + lastClearMs + '&date=' + todaySeedInfo().tag
      };
    }
    if (mode === 'weekly' && phase === 'won') {
      var wp = ensureWeeklyEntry();
      return {
        title: '我在《' + TITLE + '》周赛升至' + calcWeeklyTier(wp.score) + '（' + wp.score + '分），快来同盘竞速！',
        imageUrl: img,
        query: 'mode=weekly&level=' + level + '&src=' + src + '&score=' + score + '&ms=' + lastClearMs + '&week=' + wp.weekTag
      };
    }
    if (phase === 'won') {
      return {
        title: '我在《' + TITLE + '》第 ' + level + ' 阵拿下 ' + score + ' 分、耗时 ' + formatDurationZh(lastClearMs) + '！敢来比手速吗？',
        imageUrl: img,
        query: 'mode=' + mode + '&level=' + level + '&src=' + src + '&score=' + score + '&ms=' + lastClearMs
      };
    }
    if (tdBest && tdBest.score > 0) {
      return {
        title: '《' + TITLE + '》今日同盘已破：' + tdBest.score + ' 分 · ' + formatDurationZh(tdBest.clearMs) + '，来挑战同一盘！',
        imageUrl: img,
        query: 'mode=daily&src=' + src + '&score=' + tdBest.score + '&ms=' + tdBest.clearMs + '&date=' + todaySeedInfo().tag
      };
    }
    if (save.bestRecord && save.bestRecord.score > 0) {
      return {
        title: '我在《' + TITLE + '》最高拿下 ' + save.bestRecord.score + ' 分（耗时 ' + formatDurationZh(save.bestRecord.clearMs) + '），敢来比拼吗？',
        imageUrl: img,
        query: 'mode=campaign&level=' + (save.bestRecord.level || 1) + '&src=' + src + '&score=' + save.bestRecord.score + '&ms=' + save.bestRecord.clearMs
      };
    }
    return {
      title: isTimeline ? ('《' + TITLE + '》每日千人同盘，先比得分再拼通关耗时！') : '看清方向一键飞箭，先比分数再拼耗时，快来破阵！',
      imageUrl: img,
      query: 'mode=daily&src=' + src
    };
  }

  window.__wxSharePayload = function (channel) { return buildShareMeta(channel === 'timeline' ? 'timeline' : 'appMessage'); };
  window.__wxShareTimelinePayload = function () { return buildShareMeta('timeline'); };

  function applyIncomingShareQuery(queryObj, sceneNum) {
    if (!queryObj || typeof queryObj !== 'object') return false;
    var qMode = queryObj.mode ? String(queryObj.mode) : '';
    var qSrc = queryObj.src ? String(queryObj.src) : '';
    var qLv = Number(queryObj.level);
    var qScore = Math.max(0, Math.round(Number(queryObj.score) || 0));
    var qMs = Math.max(0, Math.round(Number(queryObj.ms) || 0));
    if (!qMode && !qSrc) return false;
    if (sceneNum === 1154) return false;

    var hasTarget = (qScore > 0 || qMs > 0);
    trackEvent('jdqk_share_enter', { src: qSrc || 'unknown', mode: qMode || 'daily', level: isFinite(qLv) ? Math.round(qLv) : 1, has_target: hasTarget ? 1 : 0 });

    if (qMode === 'daily') {
      shareTarget = hasTarget ? { mode: 'daily', level: 1, score: qScore, ms: qMs, src: qSrc, beaten: false, beatNote: '' } : null;
      var existDaily = getValidInProgress();
      if (existDaily && existDaily.mode === 'daily') resumeSavedProgress();
      else startLevel(1, 'daily', { keepShareTarget: true });
      showToast(hasTarget ? ('接下好友战书：目标 ' + qScore + '分 · ' + formatDurationZh(qMs)) : '来自好友分享：进入今日同盘！');
      return true;
    }
    if (qMode === 'weekly') {
      var targetW = (isFinite(qLv) && qLv >= 1 && qLv <= 5) ? Math.round(qLv) : 1;
      shareTarget = hasTarget ? { mode: 'weekly', level: targetW, score: qScore, ms: qMs, src: qSrc, beaten: false, beatNote: '' } : null;
      startLevel(targetW, 'weekly', { keepShareTarget: true });
      showToast('已进入好友分享的周赛第 ' + targetW + ' 盘！');
      return true;
    }
    if ((qMode === 'campaign' || qMode === 'endless') && isFinite(qLv) && qLv >= 1 && qLv <= 999) {
      var targetLv = Math.round(qLv);
      var realMode = targetLv > 60 ? 'endless' : 'campaign';
      shareTarget = hasTarget ? { mode: realMode, level: targetLv, score: qScore, ms: qMs, src: qSrc, beaten: false, beatNote: '' } : null;
      var existCamp = getValidInProgress();
      if (existCamp && existCamp.mode === realMode && existCamp.level === targetLv) resumeSavedProgress();
      else startLevel(targetLv, realMode, { keepShareTarget: true });
      showToast(hasTarget ? ('接下好友第 ' + targetLv + ' 阵战书！') : ('已进入好友分享的第 ' + targetLv + ' 阵！'));
      return true;
    }
    return false;
  }
  window.__applyShareQuery = applyIncomingShareQuery;

  // 微信生命周期：自动存盘 + BGM 切后台静音 + 分享回流 + CloudBase 启动拉取
  if (typeof wx !== 'undefined' && wx) {
    try {
      if (typeof wx.onHide === 'function') {
        wx.onHide(function () {
          saveInProgress(true);
          if (bgmPlayer) bgmPlayer.pause();
        });
      }
      if (typeof wx.getLaunchOptionsSync === 'function') {
        var initLaunch = wx.getLaunchOptionsSync();
        if (initLaunch && initLaunch.query) applyIncomingShareQuery(initLaunch.query, initLaunch.scene);
      }
      if (typeof wx.onShow === 'function') {
        wx.onShow(function (res) {
          if (save.bgmOn && audioUnlocked) syncBgmPlayback();
          if (res && res.query) applyIncomingShareQuery(res.query, res.scene);
        });
      }
    } catch (_eShareInit) {}
  }
  if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        saveInProgress(true);
        if (bgmPlayer) bgmPlayer.pause();
      } else if (save.bgmOn && audioUnlocked) {
        syncBgmPlayback();
      }
    });
  }
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('pagehide', function () { saveInProgress(true); });
    window.addEventListener('beforeunload', function () { saveInProgress(true); });
    // 网页版同样支持 URL query 测试好友战书（?mode=daily&score=360&ms=28400）
    try {
      if (window.location && window.location.search && window.location.search.length > 1) {
        var sp = new URLSearchParams(window.location.search);
        if (sp.get('mode') || sp.get('src')) {
          applyIncomingShareQuery({
            mode: sp.get('mode') || '', src: sp.get('src') || 'friend',
            level: sp.get('level') || '', score: sp.get('score') || '', ms: sp.get('ms') || ''
          }, 0);
        }
      }
    } catch (_eUrl) {}
  }

  // 启动时若已配置 CloudBase 则静默拉取合并云存档
  if (cloudBridge.isEnabled()) {
    cloudBridge.loadSaveFromCloud();
  }

  window.__gameState = function () {
    var savedSnap = getValidInProgress();
    return {
      version: '1.2.0',
      phase: phase,
      modal: modal,
      rankTab: rankTab,
      score: score,
      runTime: Math.round(runTime * 100) / 100,
      lastClearMs: lastClearMs,
      lastEarnedStars: lastEarnedStars,
      lastSfx: lastSfxName,
      sfxCount: sfxTriggerCount,
      vibeLevel: save.vibeLevel,
      uiImagesReady: {
        bg: !!(uiImages.bg_celadon && uiImages.bg_celadon.ready),
        title: !!(uiImages.title_art && uiImages.title_art.ready),
        homeBoard: !!(uiImages.home_board && uiImages.home_board.ready)
      },
      hasSavedProgress: !!savedSnap,
      savedProgress: savedSnap ? { mode: savedSnap.mode, level: savedSnap.level, remaining: savedSnap.arrows.length, score: savedSnap.score, runTime: savedSnap.runTime } : null,
      bestRecord: save.bestRecord,
      dailyBest: getTodayDailyBest(),
      weeklyBest: getCurrentWeeklyBest(),
      hearts: hearts,
      fps: fps,
      level: level,
      mode: mode,
      remainingArrows: aliveCount(),
      combo: combo,
      qiCharge: qiCharge,
      maxCombo: maxComboThisRun,
      jade: save.jade,
      bag: { hint: save.bag.hint, remove: save.bag.remove },
      starsTotal: save.starsTotal,
      skinsCount: SKINS.length,
      unlockedSkinsCount: save.unlockedSkins.length,
      dailyStreak: save.dailyStreak,
      dailyRewardedDate: save.dailyRewardedDate,
      signInDays: save.signIn.claimedDays.length,
      shareTarget: shareTarget,
      bgmOn: save.bgmOn,
      bgmSrc: getBgmSrc(),
      bgmLoaded: bgmLoaded,
      cloudEnabled: cloudBridge.isEnabled(),
      hasRewardAd: hasActiveRewardAd('default'),
      rewardBtnTag: getRewardTag('default', '看视频领', '首发限免'),
      eventsCount: recordedEvents.length,
      events: recordedEvents.slice(-15),
      tutorialStep: tutorialStep,
      hero: { x: W * 0.5, y: H * 0.5 },
      pickups: [],
      enemies: [],
      world: { w: W, h: H }
    };
  };

  var autoCooldown = 0;
  window.__autoplay = function () {
    if (modal) { modal = null; return; }
    if (phase === 'title') {
      startLevel(R.level, R.mode);
      return;
    }
    if (phase !== 'playing') return;
    autoCooldown++;
    if (autoCooldown % 4 !== 0) return;

    if (tutorialStep === 1) {
      for (var t1 = 0; t1 < arrows.length; t1++) {
        if (arrows[t1].alive && arrows[t1].role === 'tut1') { handleArrowTap(arrows[t1]); return; }
      }
    }
    if (tutorialStep === 2) {
      for (var t2 = 0; t2 < arrows.length; t2++) {
        if (arrows[t2].alive && arrows[t2].role === 'tut2b') { handleArrowTap(arrows[t2]); return; }
      }
    }

    var map = currentArrowMap();
    for (var i = 0; i < arrows.length; i++) {
      var a = arrows[i];
      if (!a.alive || a.ice > 0 || a.mist) continue;
      if (!findBlockerInMap(map, boardSpec.gridSize, a.r, a.c, a.dir)) {
        handleArrowTap(a);
        return;
      }
    }
    // 先揭开隐向迷雾箭
    for (var m = 0; m < arrows.length; m++) {
      if (arrows[m].alive && arrows[m].mist) {
        handleArrowTap(arrows[m]);
        return;
      }
    }
    // 再旋转能找到通路的转向箭
    for (var r = 0; r < arrows.length; r++) {
      var ra = arrows[r];
      if (!ra.alive || ra.ice > 0 || ra.mist || ra.kind !== 'rotator' || ra.rotLeft <= 0) continue;
      var td = ra.dir;
      var canClear = false;
      for (var t = 1; t <= ra.rotLeft; t++) {
        td = CW[td];
        if (!findBlockerInMap(map, boardSpec.gridSize, ra.r, ra.c, td)) { canClear = true; break; }
      }
      if (canClear) {
        handleArrowTap(ra);
        return;
      }
    }
  };

  setTimeout(function () {
    try { post({ type: 'renders', renders: window.__renderSlots(256) }); } catch (_e) {}
  }, 120);
})();
</script>
</body></html>
